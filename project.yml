---
name: ContextPanel
options:
  bundleIdPrefix: com.shinycomputers
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: MM5YXC7T6E
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages: {}
targets:
  ContextPanelCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelCore
        SKIP_INSTALL: true

  ContextPanel:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelPreview
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ContextPanelCore
      - target: ContextPanelWidgetExtension
        embed: true
      - target: ContextPanelRefreshAgent
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel
        PRODUCT_NAME: Context Panel
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanel-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Context Panel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID: ""
        CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET: ""
        INFOPLIST_KEY_LSApplicationCategoryType: >-
          public.app-category.productivity
        INFOPLIST_KEY_NSQuitAlwaysKeepsWindows: false
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: Config/ContextPanelAppStore.entitlements
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_APP_PROFILE_SPECIFIER)

  ContextPanelRefreshAgent:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelRefreshAgent
    dependencies:
      - target: ContextPanelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.refresh-agent
        PRODUCT_NAME: ContextPanelRefreshAgent
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanelRefreshAgent-Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID: ""
        CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET: ""
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelRefreshAgent.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: >-
            Config/ContextPanelRefreshAgentAppStore.entitlements
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_REFRESH_AGENT_PROFILE_SPECIFIER)
          SKIP_INSTALL: true

  ContextPanelWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelWidget
    dependencies:
      - target: ContextPanelCore
    info:
      path: Config/ContextPanelWidget-Info.plist
      properties:
        CFBundleDisplayName: Context Panel Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.widget
        PRODUCT_NAME: ContextPanelWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelWidget.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_WIDGET_PROFILE_SPECIFIER)

schemes:
  ContextPanel:
    build:
      targets:
        ContextPanel: all
        ContextPanelRefreshAgent: all
        ContextPanelWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
