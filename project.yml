---
name: ContextPanel
options:
  bundleIdPrefix: com.shinycomputers
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: MM5YXC7T6E
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages: {}
targets:
  ContextPanelCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelCore
        SKIP_INSTALL: true

  ContextPanelWidgetUI:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelWidgetUI
    dependencies:
      - target: ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelWidgetUI
        SKIP_INSTALL: true

  ContextPanelSettingsUI:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelSettingsUI
    dependencies:
      - target: ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelSettingsUI
        SKIP_INSTALL: true

  ContextPanelCoreCompanion:
    type: library.static
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelCoreCompanion
        PRODUCT_MODULE_NAME: ContextPanelCore
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: true

  ContextPanelWidgetUICompanion:
    type: library.static
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelWidgetUI
    dependencies:
      - target: ContextPanelCoreCompanion
    settings:
      base:
        PRODUCT_NAME: ContextPanelWidgetUICompanion
        PRODUCT_MODULE_NAME: ContextPanelWidgetUI
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: true

  ContextPanelSettingsUICompanion:
    type: library.static
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelSettingsUI
    dependencies:
      - target: ContextPanelCoreCompanion
    settings:
      base:
        PRODUCT_NAME: ContextPanelSettingsUICompanion
        PRODUCT_MODULE_NAME: ContextPanelSettingsUI
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: true

  ContextPanelCompanionSupport:
    type: library.static
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelCompanionSupport
    dependencies:
      - target: ContextPanelCoreCompanion
      - target: ContextPanelWidgetUICompanion
    settings:
      base:
        PRODUCT_NAME: ContextPanelCompanionSupport
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: true

  ContextPanelCloudKitSync:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelCloudKitSync
    dependencies:
      - target: ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelCloudKitSync
        SKIP_INSTALL: true

  ContextPanelCloudKitSyncCompanion:
    type: library.static
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelCloudKitSync
    dependencies:
      - target: ContextPanelCoreCompanion
    settings:
      base:
        PRODUCT_NAME: ContextPanelCloudKitSyncCompanion
        PRODUCT_MODULE_NAME: ContextPanelCloudKitSync
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: true

  ContextPanelCoreWatch:
    type: library.static
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelCoreWatch
        PRODUCT_MODULE_NAME: ContextPanelCore
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: true

  ContextPanelCloudKitSyncWatch:
    type: library.static
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ContextPanelCloudKitSync
    dependencies:
      - target: ContextPanelCoreWatch
    settings:
      base:
        PRODUCT_NAME: ContextPanelCloudKitSyncWatch
        PRODUCT_MODULE_NAME: ContextPanelCloudKitSync
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: true

  ContextPanelCoreTV:
    type: library.static
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ContextPanelCore
    settings:
      base:
        PRODUCT_NAME: ContextPanelCoreTV
        PRODUCT_MODULE_NAME: ContextPanelCore
        TVOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: true

  ContextPanelCloudKitSyncTV:
    type: library.static
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ContextPanelCloudKitSync
    dependencies:
      - target: ContextPanelCoreTV
    settings:
      base:
        PRODUCT_NAME: ContextPanelCloudKitSyncTV
        PRODUCT_MODULE_NAME: ContextPanelCloudKitSync
        TVOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: true

  ContextPanelTVSupport:
    type: library.static
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ContextPanelTVSupport
    dependencies:
      - target: ContextPanelCoreTV
    settings:
      base:
        PRODUCT_NAME: ContextPanelTVSupport
        TVOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: true

  ContextPanel:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelApp
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ContextPanelCore
      - target: ContextPanelCloudKitSync
      - target: ContextPanelSettingsUI
      - target: ContextPanelWidgetExtension
        embed: true
      - target: ContextPanelRefreshAgent
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    postBuildScripts:
      - name: Stamp Build Fingerprint
        script: |
          "$SRCROOT/scripts/stamp-context-panel-build.sh" \
            "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/\
            ContextPanelBuildFingerprint.txt"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel
        PRODUCT_NAME: Context Panel
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanel-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Context Panel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: >-
          public.app-category.productivity
        INFOPLIST_KEY_NSQuitAlwaysKeepsWindows: false
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: Config/ContextPanelAppStore.entitlements
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_APP_PROFILE_SPECIFIER)

  ContextPanelRefreshAgent:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelRefreshAgent
    dependencies:
      - target: ContextPanelCore
      - target: ContextPanelCloudKitSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.refresh-agent
        PRODUCT_NAME: ContextPanelRefreshAgent
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanelRefreshAgent-Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelRefreshAgent.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: >-
            Config/ContextPanelRefreshAgentAppStore.entitlements
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_REFRESH_AGENT_PROFILE_SPECIFIER)
          SKIP_INSTALL: true

  ContextPanelWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ContextPanelWidget
    dependencies:
      - target: ContextPanelCore
      - target: ContextPanelWidgetUI
    info:
      path: Config/ContextPanelWidget-Info.plist
      properties:
        CFBundleDisplayName: Context Panel Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.widget
        PRODUCT_NAME: ContextPanelWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelWidget.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_WIDGET_PROFILE_SPECIFIER)

  ContextPanelCompanion:
    type: application
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelCompanion
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ContextPanelCoreCompanion
      - target: ContextPanelWidgetUICompanion
      - target: ContextPanelCompanionSupport
      - target: ContextPanelSettingsUICompanion
      - target: ContextPanelCloudKitSyncCompanion
      - target: ContextPanelCompanionWidgetExtension
        embed: true
      - target: ContextPanelWatch
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel
        PRODUCT_NAME: Context Panel
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanelCompanion-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Context Panel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        APS_ENVIRONMENT: development
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_COMPANION_PROFILE_SPECIFIER)

  ContextPanelCompanionWidgetExtension:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, visionOS]
    deploymentTarget:
      iOS: "17.0"
      visionOS: "26.0"
    sources:
      - path: Sources/ContextPanelCompanionWidget
    dependencies:
      - target: ContextPanelCoreCompanion
      - target: ContextPanelWidgetUICompanion
      - target: ContextPanelCompanionSupport
    info:
      path: Config/ContextPanelCompanionWidget-Info.plist
      properties:
        CFBundleDisplayName: Context Panel Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.widget
        PRODUCT_NAME: ContextPanelCompanionWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        XROS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelCompanionWidget.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_COMPANION_WIDGET_PROFILE_SPECIFIER)

  ContextPanelWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ContextPanelWatch
      - path: Sources/ContextPanelWatchSupport
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ContextPanelCoreWatch
      - target: ContextPanelCloudKitSyncWatch
      - target: ContextPanelWatchWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.watch
        PRODUCT_NAME: Context Panel
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanelWatch-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Context Panel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_WATCH_PROFILE_SPECIFIER)

  ContextPanelWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ContextPanelWatchWidget
      - path: Sources/ContextPanelWatchSupport
    dependencies:
      - target: ContextPanelCoreWatch
      - target: ContextPanelCloudKitSyncWatch
    info:
      path: Config/ContextPanelWatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Context Panel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel.watch.widget
        PRODUCT_NAME: ContextPanelWatchWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelWatchWidget.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_WATCH_WIDGET_PROFILE_SPECIFIER)

  ContextPanelTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ContextPanelTV
      - path: Resources/TVAssets.xcassets
    dependencies:
      - target: ContextPanelCoreTV
      - target: ContextPanelCloudKitSyncTV
      - target: ContextPanelTVSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.contextpanel
        PRODUCT_NAME: Context Panel
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ContextPanelTV-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Context Panel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
        TVOS_DEPLOYMENT_TARGET: "17.0"
        APS_ENVIRONMENT: development
        CODE_SIGN_ENTITLEMENTS: Config/ContextPanelTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: >-
            $(CONTEXT_PANEL_APP_STORE_TV_PROFILE_SPECIFIER)

schemes:
  ContextPanel:
    build:
      targets:
        ContextPanel: all
        ContextPanelRefreshAgent: all
        ContextPanelWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
  ContextPanelCompanion:
    build:
      targets:
        ContextPanelCompanion: all
        ContextPanelCompanionWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
  ContextPanelWatch:
    build:
      targets:
        ContextPanelWatch: all
        ContextPanelWatchWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
  ContextPanelTV:
    build:
      targets:
        ContextPanelTV: all
    run:
      config: Debug
    archive:
      config: Release
