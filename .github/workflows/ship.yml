---
name: Ship

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Marketing/release version, for example 1.0.18.
        required: true
        type: string
      build_number:
        description: App Store build number. Defaults to UTC timestamp.
        required: false
        type: string
      github_release:
        description: Build and publish a GitHub Release artifact.
        required: true
        default: true
        type: boolean
      notarize_github_release:
        description: Notarize the GitHub Release artifact.
        required: true
        default: true
        type: boolean
      app_store_channel:
        description: Mac App Store Connect build-upload action.
        required: true
        default: upload
        type: choice
        options:
          - upload
          - export-only
          - skip
      companion_app_store_channel:
        description: Companion App Store Connect build-upload action.
        required: true
        default: skip
        type: choice
        options:
          - upload
          - export-only
          - skip
      companion_platform:
        description: Companion platform to archive.
        required: true
        default: ios
        type: choice
        options:
          - ios
          - visionos
          - tvos
      testflight_beta:
        description: Distribute the uploaded build to TestFlight beta groups.
        required: true
        default: true
        type: boolean
      testflight_beta_source:
        description: Uploaded build source to distribute to TestFlight.
        required: true
        default: macos
        type: choice
        options:
          - macos
          - companion
      testflight_beta_groups:
        description: Optional comma-separated TestFlight beta group names. Internal groups are included by default.
        required: false
        type: string
      include_internal_testflight_groups:
        description: Include internal TestFlight beta groups.
        required: true
        default: true
        type: boolean
      cloudkit_schema_receipt_base64:
        description: Sealed short-lived Production CloudKit schema receipt.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ship-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Trusted Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Source and Inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          scripts/release-workflow-guard.sh \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}"

  validate:
    name: Validate Release Intent
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    outputs:
      build_number: ${{ steps.intent.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Inputs
        id: intent
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_GITHUB_RELEASE: ${{ inputs.github_release }}
          INPUT_NOTARIZE_GITHUB_RELEASE: ${{ inputs.notarize_github_release }}
          INPUT_APP_STORE_CHANNEL: ${{ inputs.app_store_channel }}
          INPUT_COMPANION_APP_STORE_CHANNEL: ${{ inputs.companion_app_store_channel }}
          INPUT_COMPANION_PLATFORM: ${{ inputs.companion_platform }}
          INPUT_TESTFLIGHT_BETA: ${{ inputs.testflight_beta }}
          INPUT_TESTFLIGHT_BETA_SOURCE: ${{ inputs.testflight_beta_source }}
          INPUT_TESTFLIGHT_BETA_GROUPS: ${{ inputs.testflight_beta_groups }}
          INPUT_INCLUDE_INTERNAL_TESTFLIGHT_GROUPS: ${{ inputs.include_internal_testflight_groups }}
          INPUT_CLOUDKIT_SCHEMA_RECEIPT_BASE64: >-
            ${{ inputs.cloudkit_schema_receipt_base64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: scripts/ship-validate-inputs.sh

  github-release:
    name: GitHub Release Channel
    needs: validate
    if: ${{ inputs.github_release }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.validate.outputs.build_number }}
      create_github_release: true
      notarize: ${{ inputs.notarize_github_release }}
      cloudkit_schema_receipt_base64: ${{ inputs.cloudkit_schema_receipt_base64 }}
    secrets: inherit

  app-store-upload:
    name: Mac App Store Connect Build Upload Channel
    needs: validate
    if: ${{ inputs.app_store_channel != 'skip' }}
    uses: ./.github/workflows/app-store-connect-upload.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.validate.outputs.build_number }}
      upload: ${{ inputs.app_store_channel == 'upload' }}
      cloudkit_schema_receipt_base64: ${{ inputs.cloudkit_schema_receipt_base64 }}
    secrets: inherit

  companion-app-store-upload:
    name: Companion App Store Connect Build Upload Channel
    needs: validate
    if: ${{ inputs.companion_app_store_channel != 'skip' }}
    uses: ./.github/workflows/app-store-connect-companion-upload.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.validate.outputs.build_number }}
      platform: ${{ inputs.companion_platform }}
      upload: ${{ inputs.companion_app_store_channel == 'upload' }}
      cloudkit_schema_receipt_base64: ${{ inputs.cloudkit_schema_receipt_base64 }}
    secrets: inherit

  testflight-beta:
    name: TestFlight Beta Distribution Channel
    needs:
      - validate
      - app-store-upload
      - companion-app-store-upload
    if: >-
      ${{
        always()
        && inputs.testflight_beta
        && needs.validate.result == 'success'
        && (inputs.app_store_channel != 'upload' || needs.app-store-upload.result == 'success')
        && (inputs.companion_app_store_channel != 'upload' || needs.companion-app-store-upload.result == 'success')
        && (
          (inputs.testflight_beta_source == 'macos' && needs.app-store-upload.result == 'success')
          || (inputs.testflight_beta_source == 'companion' && needs.companion-app-store-upload.result == 'success')
        )
      }}
    uses: ./.github/workflows/testflight-beta-distribution.yml
    with:
      version: ${{ inputs.version }}
      build_number: >-
        ${{ inputs.testflight_beta_source == 'companion' && needs.companion-app-store-upload.outputs.build_number || needs.app-store-upload.outputs.build_number }}
      platform: >-
        ${{ inputs.testflight_beta_source == 'companion' && needs.companion-app-store-upload.outputs.app_store_platform || 'MAC_OS' }}
      beta_groups: ${{ inputs.testflight_beta_groups }}
      include_internal_beta_groups: ${{ inputs.include_internal_testflight_groups }}
      dry_run: false
      cloudkit_schema_receipt_base64: ${{ inputs.cloudkit_schema_receipt_base64 }}
    secrets: inherit

  summary:
    name: Release Summary
    needs:
      - validate
      - github-release
      - app-store-upload
      - companion-app-store-upload
      - testflight-beta
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Channels
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
          APP_STORE_UPLOAD_RESULT: ${{ needs.app-store-upload.result }}
          COMPANION_APP_STORE_UPLOAD_RESULT: ${{ needs.companion-app-store-upload.result }}
          TESTFLIGHT_BETA_RESULT: ${{ needs.testflight-beta.result }}
          INPUT_GITHUB_RELEASE: ${{ inputs.github_release }}
          INPUT_APP_STORE_CHANNEL: ${{ inputs.app_store_channel }}
          INPUT_COMPANION_APP_STORE_CHANNEL: ${{ inputs.companion_app_store_channel }}
          INPUT_TESTFLIGHT_BETA: ${{ inputs.testflight_beta }}
          INPUT_TESTFLIGHT_BETA_SOURCE: ${{ inputs.testflight_beta_source }}
        run: |
          set -euo pipefail
          validate_result="${VALIDATE_RESULT}"
          github_release_result="${GITHUB_RELEASE_RESULT}"
          app_store_upload_result="${APP_STORE_UPLOAD_RESULT}"
          companion_app_store_upload_result="${COMPANION_APP_STORE_UPLOAD_RESULT}"
          testflight_beta_result="${TESTFLIGHT_BETA_RESULT}"
          github_release_selected="${INPUT_GITHUB_RELEASE}"
          app_store_channel="${INPUT_APP_STORE_CHANNEL}"
          companion_app_store_channel="${INPUT_COMPANION_APP_STORE_CHANNEL}"
          testflight_beta_selected="${INPUT_TESTFLIGHT_BETA}"
          testflight_beta_source="${INPUT_TESTFLIGHT_BETA_SOURCE}"
          {
            echo "### Ship Summary"
            echo
            echo "- Version: ${INPUT_VERSION}"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Validation: ${validate_result}"
            echo "- GitHub Release: ${github_release_result}"
            echo "- Mac App Store Connect build upload: ${app_store_upload_result}"
            echo "- Companion App Store Connect build upload: ${companion_app_store_upload_result}"
            echo "- TestFlight beta distribution: ${testflight_beta_result}"
            echo "- TestFlight source: ${testflight_beta_source}"
            echo
            echo "Ship does not submit App Store Review."
            echo "After TestFlight validation, run Submit App Store Review separately; use dry_run=true first."
          } >>"${GITHUB_STEP_SUMMARY}"

          failed="false"
          if [[ "${validate_result}" != "success" ]]; then
            failed="true"
          fi
          if [[ "${github_release_selected}" == "true" ]]; then
            if [[ "${github_release_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${app_store_channel}" != "skip" ]]; then
            if [[ "${app_store_upload_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${companion_app_store_channel}" != "skip" ]]; then
            if [[ "${companion_app_store_upload_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${testflight_beta_selected}" == "true" ]]; then
            if [[ "${testflight_beta_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${failed}" == "true" ]]; then
            echo "one or more selected release channels failed" >&2
            exit 1
          fi
