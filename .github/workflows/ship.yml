---
name: Ship

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Marketing/release version, for example 1.0.18.
        required: true
        type: string
      build_number:
        description: App Store build number. Defaults to UTC timestamp.
        required: false
        type: string
      github_release:
        description: Build and publish a GitHub Release artifact.
        required: true
        default: true
        type: boolean
      notarize_github_release:
        description: Notarize the GitHub Release artifact.
        required: true
        default: true
        type: boolean
      app_store_channel:
        description: App Store Connect build-upload action.
        required: true
        default: upload
        type: choice
        options:
          - upload
          - export-only
          - skip
      testflight_beta:
        description: Distribute the uploaded build to TestFlight beta groups.
        required: true
        default: true
        type: boolean
      testflight_beta_groups:
        description: Optional comma-separated TestFlight beta group names. Internal groups are included by default.
        required: false
        type: string
      include_internal_testflight_groups:
        description: Include internal TestFlight beta groups.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ship-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Intent
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.intent.outputs.build_number }}
    steps:
      - name: Validate Inputs
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.version }}" ]]; then
            echo "version is required" >&2
            exit 1
          fi
          if [[ "${{ inputs.version }}" == "1.0" ]]; then
            echo "version 1.0 is closed for App Store submissions" >&2
            exit 1
          fi
          github_release_selected="${{ inputs.github_release }}"
          app_store_channel="${{ inputs.app_store_channel }}"
          testflight_beta_selected="${{ inputs.testflight_beta }}"
          if [[ "${github_release_selected}" != "true" ]]; then
            if [[ "${app_store_channel}" == "skip" ]]; then
              echo "select at least one release channel" >&2
              exit 1
            fi
          fi
          if [[ "${testflight_beta_selected}" == "true" ]]; then
            if [[ "${app_store_channel}" != "upload" ]]; then
              echo "testflight_beta requires app_store_channel=upload" >&2
              exit 1
            fi
          fi
          build_number="${{ inputs.build_number }}"
          if [[ -z "${build_number}" ]]; then
            build_number="$(date -u +%Y%m%d%H%M)"
          fi
          echo "build_number=${build_number}" >>"${GITHUB_OUTPUT}"
          {
            echo "### Release Intent"
            echo
            echo "- Version: ${{ inputs.version }}"
            echo "- Build number: ${build_number}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- GitHub Release: ${{ inputs.github_release }}"
            echo "- GitHub notarization: ${{ inputs.notarize_github_release }}"
            echo "- App Store channel: ${{ inputs.app_store_channel }}"
            echo "- TestFlight beta: ${{ inputs.testflight_beta }}"
            echo "- TestFlight groups: ${{ inputs.testflight_beta_groups }}"
            echo "- Include internal TestFlight groups: ${{ inputs.include_internal_testflight_groups }}"
          } >>"${GITHUB_STEP_SUMMARY}"

  github-release:
    name: GitHub Release Channel
    needs: validate
    if: ${{ inputs.github_release }}
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.validate.outputs.build_number }}
      create_github_release: true
      notarize: ${{ inputs.notarize_github_release }}
    secrets: inherit

  app-store-upload:
    name: App Store Connect Build Upload Channel
    needs: validate
    if: ${{ inputs.app_store_channel != 'skip' }}
    uses: ./.github/workflows/app-store-connect-upload.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.validate.outputs.build_number }}
      upload: ${{ inputs.app_store_channel == 'upload' }}
    secrets: inherit

  testflight-beta:
    name: TestFlight Beta Distribution Channel
    needs:
      - validate
      - app-store-upload
    if: ${{ inputs.testflight_beta }}
    uses: ./.github/workflows/testflight-beta-distribution.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ needs.app-store-upload.outputs.build_number }}
      beta_groups: ${{ inputs.testflight_beta_groups }}
      include_internal_beta_groups: ${{ inputs.include_internal_testflight_groups }}
      dry_run: false
    secrets: inherit

  summary:
    name: Release Summary
    needs:
      - validate
      - github-release
      - app-store-upload
      - testflight-beta
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Channels
        shell: bash
        run: |
          set -euo pipefail
          validate_result="${{ needs.validate.result }}"
          github_release_result="${{ needs.github-release.result }}"
          app_store_upload_result="${{ needs.app-store-upload.result }}"
          testflight_beta_result="${{ needs.testflight-beta.result }}"
          github_release_selected="${{ inputs.github_release }}"
          app_store_channel="${{ inputs.app_store_channel }}"
          testflight_beta_selected="${{ inputs.testflight_beta }}"
          {
            echo "### Ship Summary"
            echo
            echo "- Version: ${{ inputs.version }}"
            echo "- Build number: ${{ needs.validate.outputs.build_number }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Validation: ${validate_result}"
            echo "- GitHub Release: ${github_release_result}"
            echo "- App Store Connect build upload: ${app_store_upload_result}"
            echo "- TestFlight beta distribution: ${testflight_beta_result}"
            echo
            echo "Ship does not submit App Store Review."
            echo "After TestFlight validation, run Submit App Store Review separately; use dry_run=true first."
          } >>"${GITHUB_STEP_SUMMARY}"

          failed="false"
          if [[ "${validate_result}" != "success" ]]; then
            failed="true"
          fi
          if [[ "${github_release_selected}" == "true" ]]; then
            if [[ "${github_release_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${app_store_channel}" != "skip" ]]; then
            if [[ "${app_store_upload_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${testflight_beta_selected}" == "true" ]]; then
            if [[ "${testflight_beta_result}" != "success" ]]; then
              failed="true"
            fi
          fi
          if [[ "${failed}" == "true" ]]; then
            echo "one or more selected release channels failed" >&2
            exit 1
          fi
