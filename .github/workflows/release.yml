---
name: Release

"on":
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v.
        required: false
        type: string
      build_number:
        description: CFBundleVersion/build number for the packaged app.
        required: false
        type: string
      create_github_release:
        description: Create or update a GitHub Release.
        required: false
        default: true
        type: boolean
      notarize:
        description: Notarize when Apple signing secrets are configured.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v. Defaults to the current date build.
        required: false
        type: string
      build_number:
        description: CFBundleVersion/build number for the packaged app.
        required: false
        type: string
      create_github_release:
        description: Create or update a GitHub Release.
        required: true
        default: true
        type: boolean
      notarize:
        description: Notarize when Apple signing secrets are configured.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    ${{ inputs.version && format('release-v{0}', inputs.version) ||
    format('release-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Trusted Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Source and Inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          scripts/release-workflow-guard.sh \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}"

  macos:
    name: Build macOS App
    needs: guard
    runs-on: macos-26
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate Release Xcode
        run: scripts/validate-release-xcode.sh --required-major 26

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
            tag="v${version}"
          else
            version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
            tag="v${version}"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Resolve Build Number
        id: build
        shell: bash
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          build_number="${INPUT_BUILD_NUMBER}"
          if [[ -z "${build_number}" ]]; then
            build_number="$(date -u +%Y%m%d%H%M)"
          fi
          echo "build_number=${build_number}" >>"${GITHUB_OUTPUT}"

      - name: Validate Release Configuration
        shell: bash
        env:
          INPUT_CREATE_GITHUB_RELEASE: ${{ inputs.create_github_release }}
        run: |
          set -euo pipefail
          publish_requested="${INPUT_CREATE_GITHUB_RELEASE}"
          if [[ "${publish_requested}" == "true" ]]; then
            echo "Release publication requested."
          fi

      - name: Import Apple Signing Assets
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_APP_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_BASE64 }}
          MACOS_WIDGET_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.MACOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          identity="-"
          app_profile=""
          widget_profile=""
          refresh_agent_profile=""

          if [[ -n "${MACOS_CERTIFICATE_P12:-}" ]]; then
            keychain_password="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
            keychain_path="${RUNNER_TEMP}/context-panel-signing.keychain-db"
            certificate_path="${RUNNER_TEMP}/certificate.p12"

            echo "${MACOS_CERTIFICATE_P12}" | base64 -D >"${certificate_path}"
            security create-keychain -p "${keychain_password}" "${keychain_path}"
            security set-keychain-settings -lut 21600 "${keychain_path}"
            security unlock-keychain -p "${keychain_password}" "${keychain_path}"
            security import "${certificate_path}" \
              -P "${MACOS_CERTIFICATE_PASSWORD:-}" \
              -A \
              -k "${keychain_path}"
            existing_keychains=()
            while IFS= read -r keychain; do
              keychain="$({ printf '%s\n' "${keychain}" | tr -d '"'; } \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [[ -n "${keychain}" ]]; then
                existing_keychains+=("${keychain}")
              fi
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
            security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
            identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
            printf '%s\n' "${identity_output}"
            identities=()
            while IFS= read -r candidate; do
              candidate="$(printf '%s' "${candidate}" | tr '[:lower:]' '[:upper:]')"
              if [[ "${#candidate}" -eq 40 && "${candidate}" != *[!0-9A-F]* ]]; then
                identities+=("${candidate}")
              fi
            done < <(printf '%s\n' "${identity_output}" | awk '/"Developer ID Application:/ { print $2 }')
            if [[ "${#identities[@]}" -ne 1 ]]; then
              echo "expected exactly one Developer ID Application identity in MACOS_CERTIFICATE_P12; found ${#identities[@]}" >&2
              exit 1
            fi
            identity="${identities[0]}"

            if [[ -z "${MACOS_APP_PROVISIONING_PROFILE_BASE64:-}" ||
              -z "${MACOS_WIDGET_PROVISIONING_PROFILE_BASE64:-}" ||
              -z "${MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64:-}" ]]; then
              echo "Developer ID signing requires app, widget, and refresh-agent provisioning profiles from the same certificate set" >&2
              exit 1
            fi
          elif [[ -n "${MACOS_APP_PROVISIONING_PROFILE_BASE64:-}${MACOS_WIDGET_PROVISIONING_PROFILE_BASE64:-}${MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            echo "Developer ID provisioning profiles are configured without MACOS_CERTIFICATE_P12" >&2
            exit 1
          fi

          if [[ -n "${MACOS_APP_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            app_profile="${RUNNER_TEMP}/ContextPanel.provisionprofile"
            echo "${MACOS_APP_PROVISIONING_PROFILE_BASE64}" | base64 -D >"${app_profile}"
          fi
          if [[ -n "${MACOS_WIDGET_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            widget_profile="${RUNNER_TEMP}/ContextPanelWidgetExtension.provisionprofile"
            echo "${MACOS_WIDGET_PROVISIONING_PROFILE_BASE64}" | base64 -D >"${widget_profile}"
          fi
          if [[ -n "${MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            refresh_agent_profile="${RUNNER_TEMP}/ContextPanelRefreshAgent.provisionprofile"
            echo "${MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64}" | base64 -D >"${refresh_agent_profile}"
          fi

          {
            echo "identity=${identity}"
            echo "app_profile=${app_profile}"
            echo "widget_profile=${widget_profile}"
            echo "refresh_agent_profile=${refresh_agent_profile}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build Release Artifact
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_PROFILE: ${{ steps.signing.outputs.app_profile }}
          WIDGET_PROFILE: ${{ steps.signing.outputs.widget_profile }}
          REFRESH_AGENT_PROFILE: ${{ steps.signing.outputs.refresh_agent_profile }}
          INPUT_CREATE_GITHUB_RELEASE: ${{ inputs.create_github_release }}
          INPUT_NOTARIZE: ${{ inputs.notarize }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          args=(
            --version "${VERSION}"
            --build-number "${BUILD_NUMBER}"
            --output dist
            --identity "${SIGNING_IDENTITY}"
          )
          if [[ -n "${APP_PROFILE}" ]]; then
            args+=(--app-provisioning-profile "${APP_PROFILE}")
          fi
          if [[ -n "${WIDGET_PROFILE}" ]]; then
            args+=(--widget-provisioning-profile "${WIDGET_PROFILE}")
          fi
          if [[ -n "${REFRESH_AGENT_PROFILE}" ]]; then
            args+=(--refresh-agent-provisioning-profile "${REFRESH_AGENT_PROFILE}")
          fi
          notarize_requested="${INPUT_NOTARIZE}"
          if [[ "${notarize_requested}" == "true" ]]; then
            has_notary_credentials="false"
            if [[ -n "${APPLE_NOTARY_KEYCHAIN_PROFILE:-}" ]]; then
              has_notary_credentials="true"
            elif [[ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" && -n "${APP_STORE_CONNECT_KEY_ID:-}" && -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
              has_notary_credentials="true"
            elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
              has_notary_credentials="true"
            fi
            if [[ "${has_notary_credentials}" != "true" ]]; then
              echo "notarization was requested but no complete notarization credential set is configured" >&2
              exit 1
            fi
            args+=(--notarize)
            if [[ -n "${APPLE_NOTARY_KEYCHAIN_PROFILE:-}" ]]; then
              args+=(--notary-keychain-profile "${APPLE_NOTARY_KEYCHAIN_PROFILE}")
            elif [[ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" || -n "${APP_STORE_CONNECT_KEY_ID:-}" || -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
              if [[ -z "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" || -z "${APP_STORE_CONNECT_KEY_ID:-}" || -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
                echo "notarization requires APP_STORE_CONNECT_API_KEY_P8_BASE64, APP_STORE_CONNECT_KEY_ID, and APP_STORE_CONNECT_ISSUER_ID" >&2
                exit 1
              fi
              notary_key="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
              echo "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" | base64 -D >"${notary_key}"
              chmod 600 "${notary_key}"
              args+=(
                --notary-key "${notary_key}"
                --notary-key-id "${APP_STORE_CONNECT_KEY_ID}"
                --notary-issuer "${APP_STORE_CONNECT_ISSUER_ID}"
              )
            fi
          fi

          scripts/package-native-macos-app.sh "${args[@]}"
          zip_path="dist/ContextPanel-${VERSION}-macOS.zip"
          echo "zip_path=${zip_path}" >>"${GITHUB_OUTPUT}"
          echo "metadata_path=dist/release-metadata.json" >>"${GITHUB_OUTPUT}"
          {
            echo "### GitHub Release Artifact"
            echo
            echo "- Version: ${VERSION}"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Tag: ${TAG}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Zip: ${zip_path}"
            echo "- Metadata: dist/release-metadata.json"
            echo "- Create GitHub Release: ${INPUT_CREATE_GITHUB_RELEASE}"
            echo "- Notarization requested: ${notarize_requested}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ContextPanel-${{ steps.version.outputs.version }}-macOS
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.metadata_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
        shell: bash
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Context Panel ${VERSION}"
            echo
            notarized="$(sed -n 's/^  "notarized": \(.*\)$/\1/p' "${METADATA_PATH}" | tr -d ',')"
            signing_identity="$(sed -n 's/^  "signingIdentity": "\(.*\)",$/\1/p' "${METADATA_PATH}")"
            if [[ "${notarized}" == "true" ]]; then
              echo "This build is signed and notarized."
            elif [[ "${signing_identity}" != "-" ]]; then
              echo "This build is signed but was not notarized by this workflow run."
            else
              echo "This build is ad-hoc signed for CI validation. Configure Apple signing and notarization secrets before using it as a friend-installable release."
            fi
          } >"${notes}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP_PATH}" "${METADATA_PATH}" --clobber
            gh release edit "${TAG}" --title "Context Panel ${VERSION}" --notes-file "${notes}"
          else
            gh release create "${TAG}" "${ZIP_PATH}" "${METADATA_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Context Panel ${VERSION}" \
              --notes-file "${notes}"
          fi
