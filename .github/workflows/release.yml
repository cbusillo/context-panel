---
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v.
        required: false
        type: string
      build_number:
        description: CFBundleVersion/build number for the packaged app.
        required: false
        type: string
      create_github_release:
        description: Create or update a GitHub Release.
        required: false
        default: true
        type: boolean
      notarize:
        description: Notarize when Apple signing secrets are configured.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v. Defaults to the current date build.
        required: false
        type: string
      build_number:
        description: CFBundleVersion/build number for the packaged app.
        required: false
        type: string
      create_github_release:
        description: Create or update a GitHub Release.
        required: true
        default: true
        type: boolean
      notarize:
        description: Notarize when Apple signing secrets are configured.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: >-
    ${{ inputs.version && format('release-v{0}', inputs.version) ||
    format('release-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS App
    runs-on: macos-26

    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_BASE64 }}
      MACOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
      MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64 }}
      CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID: >-
        ${{ secrets.CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID }}
      CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET: >-
        ${{ secrets.CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate Release Xcode
        run: scripts/validate-release-xcode.sh --required-major 26

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
            tag="v${version}"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Resolve Build Number
        id: build
        shell: bash
        run: |
          set -euo pipefail
          build_number="${{ inputs.build_number }}"
          if [[ -z "${build_number}" ]]; then
            build_number="$(date -u +%Y%m%d%H%M)"
          fi
          echo "build_number=${build_number}" >>"${GITHUB_OUTPUT}"

      - name: Validate Release Configuration
        shell: bash
        run: |
          set -euo pipefail
          publish_requested="${{ inputs.create_github_release }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish_requested="true"
          fi
          if [[ "${publish_requested}" == "true" ]]; then
            if [[ -z "${CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID:-}" ]]; then
              echo "CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID is required" >&2
              exit 1
            fi
            if [[ -z "${CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET:-}" ]]; then
              echo "CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET is required" >&2
              exit 1
            fi
          fi

      - name: Import Apple Signing Assets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          identity="-"
          app_profile=""
          widget_profile=""
          refresh_agent_profile=""

          if [[ -n "${MACOS_CERTIFICATE_P12:-}" ]]; then
            keychain_password="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
            keychain_path="${RUNNER_TEMP}/context-panel-signing.keychain-db"
            certificate_path="${RUNNER_TEMP}/certificate.p12"

            echo "${MACOS_CERTIFICATE_P12}" | base64 -D >"${certificate_path}"
            security create-keychain -p "${keychain_password}" "${keychain_path}"
            security set-keychain-settings -lut 21600 "${keychain_path}"
            security unlock-keychain -p "${keychain_password}" "${keychain_path}"
            security import "${certificate_path}" \
              -P "${MACOS_CERTIFICATE_PASSWORD:-}" \
              -A \
              -k "${keychain_path}"
            existing_keychains=()
            while IFS= read -r keychain; do
              keychain="$({ printf '%s\n' "${keychain}" | tr -d '"'; } \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [[ -n "${keychain}" ]]; then
                existing_keychains+=("${keychain}")
              fi
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
            security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
            security find-identity -v -p codesigning "${keychain_path}"
            identity="auto"
          fi

          if [[ -n "${MACOS_APP_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            app_profile="${RUNNER_TEMP}/ContextPanel.provisionprofile"
            echo "${MACOS_APP_PROVISIONING_PROFILE_BASE64}" | base64 -D >"${app_profile}"
          fi
          if [[ -n "${MACOS_WIDGET_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            widget_profile="${RUNNER_TEMP}/ContextPanelWidgetExtension.provisionprofile"
            echo "${MACOS_WIDGET_PROVISIONING_PROFILE_BASE64}" | base64 -D >"${widget_profile}"
          fi
          if [[ -n "${MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            refresh_agent_profile="${RUNNER_TEMP}/ContextPanelRefreshAgent.provisionprofile"
            echo "${MACOS_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64}" | base64 -D >"${refresh_agent_profile}"
          fi

          {
            echo "identity=${identity}"
            echo "app_profile=${app_profile}"
            echo "widget_profile=${widget_profile}"
            echo "refresh_agent_profile=${refresh_agent_profile}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build Release Artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --version "${{ steps.version.outputs.version }}"
            --build-number "${{ steps.build.outputs.build_number }}"
            --output dist
            --identity "${{ steps.signing.outputs.identity }}"
          )
          if [[ -n "${{ steps.signing.outputs.app_profile }}" ]]; then
            args+=(--app-provisioning-profile "${{ steps.signing.outputs.app_profile }}")
          fi
          if [[ -n "${{ steps.signing.outputs.widget_profile }}" ]]; then
            args+=(--widget-provisioning-profile "${{ steps.signing.outputs.widget_profile }}")
          fi
          if [[ -n "${{ steps.signing.outputs.refresh_agent_profile }}" ]]; then
            args+=(--refresh-agent-provisioning-profile "${{ steps.signing.outputs.refresh_agent_profile }}")
          fi
          notarize_requested="${{ inputs.notarize }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            notarize_requested="true"
          fi
          if [[ "${notarize_requested}" == "true" ]]; then
            has_notary_credentials="false"
            if [[ -n "${APPLE_NOTARY_KEYCHAIN_PROFILE:-}" ]]; then
              has_notary_credentials="true"
            elif [[ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" && -n "${APP_STORE_CONNECT_KEY_ID:-}" && -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
              has_notary_credentials="true"
            elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
              has_notary_credentials="true"
            fi
            if [[ "${has_notary_credentials}" != "true" ]]; then
              echo "notarization was requested but no complete notarization credential set is configured" >&2
              exit 1
            fi
            args+=(--notarize)
            if [[ -n "${APPLE_NOTARY_KEYCHAIN_PROFILE:-}" ]]; then
              args+=(--notary-keychain-profile "${APPLE_NOTARY_KEYCHAIN_PROFILE}")
            elif [[ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" || -n "${APP_STORE_CONNECT_KEY_ID:-}" || -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
              if [[ -z "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" || -z "${APP_STORE_CONNECT_KEY_ID:-}" || -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]]; then
                echo "notarization requires APP_STORE_CONNECT_API_KEY_P8_BASE64, APP_STORE_CONNECT_KEY_ID, and APP_STORE_CONNECT_ISSUER_ID" >&2
                exit 1
              fi
              notary_key="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
              echo "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" | base64 -D >"${notary_key}"
              chmod 600 "${notary_key}"
              args+=(
                --notary-key "${notary_key}"
                --notary-key-id "${APP_STORE_CONNECT_KEY_ID}"
                --notary-issuer "${APP_STORE_CONNECT_ISSUER_ID}"
              )
            fi
          fi

          scripts/package-native-macos-app.sh "${args[@]}"
          zip_path="dist/ContextPanel-${{ steps.version.outputs.version }}-macOS.zip"
          echo "zip_path=${zip_path}" >>"${GITHUB_OUTPUT}"
          echo "metadata_path=dist/release-metadata.json" >>"${GITHUB_OUTPUT}"
          {
            echo "### GitHub Release Artifact"
            echo
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Build number: ${{ steps.build.outputs.build_number }}"
            echo "- Tag: ${{ steps.version.outputs.tag }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Zip: ${zip_path}"
            echo "- Metadata: dist/release-metadata.json"
            echo "- Create GitHub Release: ${{ inputs.create_github_release }}"
            echo "- Notarization requested: ${notarize_requested}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ContextPanel-${{ steps.version.outputs.version }}-macOS
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.metadata_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
        shell: bash
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Context Panel ${VERSION}"
            echo
            notarized="$(sed -n 's/^  "notarized": \(.*\)$/\1/p' "${METADATA_PATH}" | tr -d ',')"
            signing_identity="$(sed -n 's/^  "signingIdentity": "\(.*\)",$/\1/p' "${METADATA_PATH}")"
            if [[ "${notarized}" == "true" ]]; then
              echo "This build is signed and notarized."
            elif [[ "${signing_identity}" != "-" ]]; then
              echo "This build is signed but was not notarized by this workflow run."
            else
              echo "This build is ad-hoc signed for CI validation. Configure Apple signing and notarization secrets before using it as a friend-installable release."
            fi
          } >"${notes}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP_PATH}" "${METADATA_PATH}" --clobber
            gh release edit "${TAG}" --title "Context Panel ${VERSION}" --notes-file "${notes}"
          else
            gh release create "${TAG}" "${ZIP_PATH}" "${METADATA_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Context Panel ${VERSION}" \
              --notes-file "${notes}"
          fi
