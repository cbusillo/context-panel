---
name: App Store Connect Build Upload

"on":
  workflow_call:
    inputs:
      version:
        description: App Store marketing version, for example 1.0.18.
        required: true
        type: string
      build_number:
        description: Build number. Defaults to UTC timestamp.
        required: false
        type: string
      upload:
        description: Upload to App Store Connect. Disable to only export a pkg.
        required: false
        default: true
        type: boolean
      cloudkit_schema_receipt_base64:
        description: Optional legacy receipt (option C). Leave empty for the Mac publication-time check.
        required: false
        type: string
    outputs:
      build_number:
        description: Resolved CFBundleVersion build number.
        value: ${{ jobs.upload.outputs.build_number }}
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version, for example 1.0.18.
        required: true
        type: string
      build_number:
        description: Build number. Defaults to UTC timestamp.
        required: false
        type: string
      upload:
        description: Upload to App Store Connect. Disable to only export a pkg.
        required: true
        default: true
        type: boolean
      cloudkit_schema_receipt_base64:
        description: Optional legacy receipt (option C). Leave empty for the Mac publication-time check.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-connect-upload-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Trusted Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Source and Inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          scripts/release-workflow-guard.sh \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}"

      - name: Require Completed Approval Setup
        env:
          RELEASE_APPROVALS_CONFIGURED: ${{ vars.RELEASE_APPROVALS_CONFIGURED }}
        run: scripts/release-approval-config.sh

      - name: Verify Required Review Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-approval-environment.py

  approve:
    name: Approve Release Intent
    needs: guard
    # Ship already reviewed this exact caller intent; all other callers need review.
    if: ${{ !(github.workflow_ref == format('{0}/.github/workflows/ship.yml@refs/heads/main', github.repository)) }}
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: read
    steps:
      - name: Record Approved Intent
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          printf 'Approved release intent for version %s at %s\n' "$INPUT_VERSION" "$GITHUB_SHA"

  upload:
    name: Upload Mac App
    needs: [guard, approve]
    runs-on: macos-26
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success' &&
          (needs.approve.result == 'success' ||
           (github.workflow_ref == format('{0}/.github/workflows/ship.yml@refs/heads/main', github.repository) && needs.approve.result == 'skipped')) }}
    environment: release
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate Release Xcode
        run: scripts/validate-release-xcode.sh --required-major 26

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve Build Number
        id: build
        shell: bash
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          build_number="${INPUT_BUILD_NUMBER}"
          if [[ -z "${build_number}" ]]; then
            build_number="$(date -u +%Y%m%d%H%M)"
          fi
          echo "build_number=${build_number}" >>"${GITHUB_OUTPUT}"

      - name: Import Signing Assets
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_APP_STORE_DISTRIBUTION_CERTIFICATE_P12: >-
            ${{ secrets.MACOS_APP_STORE_DISTRIBUTION_CERTIFICATE_P12 }}
          MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12: >-
            ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_STORE_CERTIFICATE_PASSWORD: >-
            ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          keychain_path="${RUNNER_TEMP}/context-panel-app-store.keychain-db"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          import_p12() {
            local secret_value="$1"
            local file_name="$2"
            local password="${3:-}"
            if [[ -z "${secret_value}" ]]; then
              return
            fi
            local p12_path="${RUNNER_TEMP}/${file_name}"
            printf '%s' "${secret_value}" | base64 -D >"${p12_path}"
            security import "${p12_path}" \
              -P "${password}" \
              -A \
              -k "${keychain_path}"
          }

          import_p12 "${MACOS_CERTIFICATE_P12:-}" "macos-certificate.p12" "${MACOS_CERTIFICATE_PASSWORD:-}"
          import_p12 "${MACOS_APP_STORE_DISTRIBUTION_CERTIFICATE_P12:-}" "app-store-distribution.p12" "${MACOS_APP_STORE_CERTIFICATE_PASSWORD:-${MACOS_CERTIFICATE_PASSWORD:-}}"
          import_p12 "${MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12:-}" "app-store-installer.p12" "${MACOS_APP_STORE_CERTIFICATE_PASSWORD:-${MACOS_CERTIFICATE_PASSWORD:-}}"

          existing_keychains=()
          while IFS= read -r keychain; do
            keychain="$({ printf '%s\n' "${keychain}" | tr -d '"'; } \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -n "${keychain}" ]]; then
              existing_keychains+=("${keychain}")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v "${keychain_path}"

      - name: Write Provisioning Profiles
        shell: bash
        env:
          MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64 }}
          MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64: >-
            ${{ secrets.MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .build/provisioning-appstore
          if [[ -z "${MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64:-}" || -z "${MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64:-}" || -z "${MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            echo "Mac App Store app, widget, and refresh agent provisioning profile secrets are required." >&2
            exit 1
          fi
          printf '%s' "${MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64}" | base64 -D > .build/provisioning-appstore/ContextPanel.provisionprofile
          printf '%s' "${MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64}" | base64 -D > .build/provisioning-appstore/ContextPanelWidgetExtension.provisionprofile
          printf '%s' "${MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64}" | base64 -D > .build/provisioning-appstore/ContextPanelRefreshAgent.provisionprofile

      - name: Archive Before Schema Check
        shell: bash
        env:
          CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_BASE64: >-
            ${{ inputs.cloudkit_schema_receipt_base64 }}
          CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY: >-
            ${{ secrets.CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          args=(
            --version "${INPUT_VERSION}"
            --build-number "${BUILD_NUMBER}"
          )
          if [[ "${INPUT_UPLOAD}" != "true" ]]; then
            args+=(--export-only)
          fi
          scripts/upload-app-store-connect-macos-app.sh --archive-only "${args[@]}"

      - name: Check Production CloudKit at Publication
        if: ${{ inputs.upload }}
        uses: ./.github/actions/cloudkit-publication-check
        with:
          channel: macos
          receipt: ${{ inputs.cloudkit_schema_receipt_base64 }}
          receipt-key: ${{ secrets.CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY }}

      - name: Upload Verified Archive
        shell: bash
        env:
          CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_BASE64: >-
            ${{ inputs.cloudkit_schema_receipt_base64 }}
          CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY: >-
            ${{ secrets.CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          args=(
            --version "${INPUT_VERSION}"
            --build-number "${BUILD_NUMBER}"
          )
          if [[ "${INPUT_UPLOAD}" != "true" ]]; then
            args+=(--export-only)
          fi
          scripts/upload-app-store-connect-macos-app.sh --skip-archive "${args[@]}"
          {
            echo "### App Store Connect Build Upload"
            echo
            echo "- Version: ${INPUT_VERSION}"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            if [[ "${INPUT_UPLOAD}" == "true" ]]; then
              echo "- Mode: upload"
            else
              echo "- Mode: export-only"
            fi
            echo "- TestFlight beta distribution: handled by the TestFlight Beta Distribution workflow"
            echo "- Result: succeeded"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload Export Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect-${{ inputs.version }}-${{ steps.build.outputs.build_number }}
          path: |
            .build/app-store-connect/UploadOptions.plist
            .build/app-store-connect/ExpectedBuildManifest-*.json
            .build/app-store-connect/upload
          if-no-files-found: ignore
