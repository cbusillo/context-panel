---
name: TestFlight Beta Distribution

"on":
  workflow_call:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: true
        type: string
      platform:
        description: App Store Connect platform to distribute.
        required: true
        type: string
      beta_groups:
        description: Optional comma-separated TestFlight beta group names. Internal groups are included by default.
        required: false
        type: string
      include_internal_beta_groups:
        description: Include internal TestFlight beta groups.
        required: false
        default: true
        type: boolean
      dry_run:
        description: Validate build and selected beta groups without assigning the build.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: true
        type: string
      platform:
        description: App Store Connect platform to distribute.
        required: true
        type: choice
        options:
          - IOS
          - MAC_OS
          - TV_OS
          - VISION_OS
      beta_groups:
        description: Optional comma-separated TestFlight beta group names. Internal groups are included by default.
        required: false
        type: string
      include_internal_beta_groups:
        description: Include internal TestFlight beta groups.
        required: true
        default: true
        type: boolean
      dry_run:
        description: Validate build and selected beta groups without assigning the build.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-beta-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Trusted Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Source and Inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          scripts/release-workflow-guard.sh \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}"

      - name: Require Completed Release Setup
        env:
          RELEASE_APPROVALS_CONFIGURED: ${{ vars.RELEASE_APPROVALS_CONFIGURED }}
        run: scripts/release-approval-config.sh

      - name: Verify No-Click Release Environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-approval-environment.py

  intent:
    name: Record Release Intent
    needs: guard
    # Ship already records this exact caller intent; other callers record their own.
    if: ${{ !(github.workflow_ref == format('{0}/.github/workflows/ship.yml@refs/heads/main', github.repository)) }}
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: read
    steps:
      - name: Record Standing Acceptance
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          printf 'Release intent under standing acceptance for version %s at %s\n' "$INPUT_VERSION" "$GITHUB_SHA"

  distribute:
    name: Distribute TestFlight Beta
    needs: [guard, intent]
    runs-on: macos-26
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success' &&
          (needs.intent.result == 'success' ||
           (github.workflow_ref == format('{0}/.github/workflows/ship.yml@refs/heads/main', github.repository) && needs.intent.result == 'skipped')) }}
    environment: release

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python Dependencies
        run: |
          python3 -m venv .build/testflight-beta-venv
          .build/testflight-beta-venv/bin/python -m pip install --upgrade pip
          .build/testflight-beta-venv/bin/python -m pip install cryptography

      - name: Check Production CloudKit Schema
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
        run: python3 scripts/cloudkit-schema-gate.py check

      - name: Distribute Beta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_BETA_GROUPS: ${{ inputs.beta_groups }}
          INPUT_INCLUDE_INTERNAL_BETA_GROUPS: ${{ inputs.include_internal_beta_groups }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          args=(
            --version "${INPUT_VERSION}"
            --build-number "${INPUT_BUILD_NUMBER}"
          )
          args+=(--platform "${INPUT_PLATFORM}")
          if [[ -n "${INPUT_BETA_GROUPS}" ]]; then
            args+=(--beta-group "${INPUT_BETA_GROUPS}")
          fi
          if [[ "${INPUT_INCLUDE_INTERNAL_BETA_GROUPS}" != "true" ]]; then
            args+=(--skip-internal-beta-groups)
          fi
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          .build/testflight-beta-venv/bin/python \
            scripts/distribute-testflight-beta.py \
            "${args[@]}"
          {
            echo "### TestFlight Beta Distribution"
            echo
            echo "- Version: ${INPUT_VERSION}"
            echo "- Build number: ${INPUT_BUILD_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Platform: ${INPUT_PLATFORM}"
            echo "- Beta groups: ${INPUT_BETA_GROUPS:-internal groups}"
            echo "- Include internal groups: ${INPUT_INCLUDE_INTERNAL_BETA_GROUPS}"
            echo "- Dry run: ${INPUT_DRY_RUN}"
            echo "- Result: succeeded"
          } >>"${GITHUB_STEP_SUMMARY}"
