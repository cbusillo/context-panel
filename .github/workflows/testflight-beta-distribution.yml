---
name: TestFlight Beta Distribution

"on":
  workflow_call:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: true
        type: string
      platform:
        description: App Store Connect platform to distribute.
        required: true
        type: string
      beta_groups:
        description: Optional comma-separated TestFlight beta group names. Internal groups are included by default.
        required: false
        type: string
      include_internal_beta_groups:
        description: Include internal TestFlight beta groups.
        required: false
        default: true
        type: boolean
      dry_run:
        description: Validate build and selected beta groups without assigning the build.
        required: false
        default: false
        type: boolean
      cloudkit_schema_receipt_base64:
        description: Sealed short-lived Production CloudKit schema receipt.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: true
        type: string
      platform:
        description: App Store Connect platform to distribute.
        required: true
        type: choice
        options:
          - IOS
          - MAC_OS
          - TV_OS
          - VISION_OS
      beta_groups:
        description: Optional comma-separated TestFlight beta group names. Internal groups are included by default.
        required: false
        type: string
      include_internal_beta_groups:
        description: Include internal TestFlight beta groups.
        required: true
        default: true
        type: boolean
      dry_run:
        description: Validate build and selected beta groups without assigning the build.
        required: true
        default: false
        type: boolean
      cloudkit_schema_receipt_base64:
        description: Sealed short-lived Production CloudKit schema receipt.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-beta-${{ inputs.version }}-${{ inputs.build_number }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Trusted Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Source and Inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          scripts/release-workflow-guard.sh \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}"

  distribute:
    name: Distribute TestFlight Beta
    needs: guard
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python Dependencies
        run: |
          python3 -m venv .build/testflight-beta-venv
          .build/testflight-beta-venv/bin/python -m pip install --upgrade pip
          .build/testflight-beta-venv/bin/python -m pip install cryptography

      - name: Verify Production CloudKit Schema Receipt
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_BASE64: >-
            ${{ inputs.cloudkit_schema_receipt_base64 }}
          CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY: >-
            ${{ secrets.CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_KEY }}
        run: |
          python3 scripts/cloudkit-schema-receipt.py verify \
            --receipt-base64-env CONTEXT_PANEL_CLOUDKIT_SCHEMA_RECEIPT_BASE64 \
            --environment production \
            --container-id iCloud.com.shinycomputers.contextpanel \
            --source-commit "${GITHUB_SHA}"

      - name: Distribute Beta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_BETA_GROUPS: ${{ inputs.beta_groups }}
          INPUT_INCLUDE_INTERNAL_BETA_GROUPS: ${{ inputs.include_internal_beta_groups }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          args=(
            --version "${INPUT_VERSION}"
            --build-number "${INPUT_BUILD_NUMBER}"
          )
          args+=(--platform "${INPUT_PLATFORM}")
          if [[ -n "${INPUT_BETA_GROUPS}" ]]; then
            args+=(--beta-group "${INPUT_BETA_GROUPS}")
          fi
          if [[ "${INPUT_INCLUDE_INTERNAL_BETA_GROUPS}" != "true" ]]; then
            args+=(--skip-internal-beta-groups)
          fi
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          .build/testflight-beta-venv/bin/python \
            scripts/distribute-testflight-beta.py \
            "${args[@]}"
          {
            echo "### TestFlight Beta Distribution"
            echo
            echo "- Version: ${INPUT_VERSION}"
            echo "- Build number: ${INPUT_BUILD_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Platform: ${INPUT_PLATFORM}"
            echo "- Beta groups: ${INPUT_BETA_GROUPS:-internal groups}"
            echo "- Include internal groups: ${INPUT_INCLUDE_INTERNAL_BETA_GROUPS}"
            echo "- Dry run: ${INPUT_DRY_RUN}"
            echo "- Result: succeeded"
          } >>"${GITHUB_STEP_SUMMARY}"
