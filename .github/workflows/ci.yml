---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_TIME_BUDGET_MINUTES: "15"

jobs:
  swift:
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      '["macos-26"]' || '["self-hosted", "macOS", "ARM64", "context-panel"]') }}

    steps:
      - name: Record job start
        run: echo "CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Provision physical corpus Git compiler
        if: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          required="$(jq -r '.gitVersion' Config/ContextPanelPhysicalDefectCorpus.json)"
          if [[ "$required" != "2.55.0" ]]; then
            echo "::error::No checksum-pinned CI compiler is configured for required Git $required"
            exit 1
          fi
          archive="$RUNNER_TEMP/git-$required.tar.xz"
          source_dir="$RUNNER_TEMP/git-$required"
          install_dir="$RUNNER_TEMP/git-$required-install"
          curl --fail --location --silent --show-error \
            "https://www.kernel.org/pub/software/scm/git/git-$required.tar.xz" \
            --output "$archive"
          echo "457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357  $archive" \
            | shasum -a 256 --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          make -C "$source_dir" -j"$(sysctl -n hw.ncpu)" \
            prefix="$install_dir" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
          make -C "$source_dir" prefix="$install_dir" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Verify physical corpus Git compiler
        run: |
          required="$(jq -r '.gitVersion' Config/ContextPanelPhysicalDefectCorpus.json)"
          actual="$(git --version | awk '{print $3}')"
          if [[ "$actual" != "$required" ]]; then
            echo "::error::Installed Git version $actual does not match corpus-required version $required"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode
        run: xcodebuild -version

      # Pull requests that touch only documentation or validation tooling skip
      # the Swift and companion builds. Every push to main runs them all.
      - name: Classify change scope
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-change-scope.py --base "$BASE_SHA"

      - name: Run commit gate
        env:
          RUN_PRODUCT: ${{ steps.scope.outputs.product != 'false' }}
        run: |
          if [[ "$RUN_PRODUCT" == "true" ]]; then
            scripts/commit-gate.sh
          else
            scripts/commit-gate.sh --skip-swift
          fi

      - name: Run routine Python test lane
        timeout-minutes: 5
        run: >-
          python3 scripts/context-panel-test-lanes.py run
          --lane routine-ci-python

      - name: Install XcodeGen
        if: ${{ steps.scope.outputs.product != 'false' }}
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Validate companion iOS build
        if: ${{ steps.scope.outputs.product != 'false' }}
        run: >-
          scripts/validate-companion-builds.sh
          --configuration Release --archive ios

      - name: Validate companion watchOS build
        if: ${{ steps.scope.outputs.product != 'false' }}
        run: >-
          scripts/validate-companion-builds.sh --configuration Release watchos

      - name: Validate companion tvOS archive
        if: ${{ steps.scope.outputs.product != 'false' }}
        run: >-
          scripts/validate-companion-builds.sh --configuration Release --archive tvos

      - name: Upload test lane timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-lane-timings-${{ github.run_attempt }}
          path: |
            .build/test-lane-timings/fast-local-python.json
            .build/test-lane-timings/routine-ci-python.json
            .build/test-lane-timings/routine-ci-swift.json
          if-no-files-found: warn

      - name: Report time budget
        if: always()
        run: |
          if [[ -z "${CI_JOB_STARTED_AT:-}" ]]; then
            exit 0
          fi
          elapsed_minutes=$(( ($(date +%s) - CI_JOB_STARTED_AT) / 60 ))
          echo "CI job time: ${elapsed_minutes}m (budget ${CI_TIME_BUDGET_MINUTES}m)" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed_minutes > CI_TIME_BUDGET_MINUTES )); then
            echo "::warning::CI job took ${elapsed_minutes}m, over the ${CI_TIME_BUDGET_MINUTES}m pull-request budget"
          fi
