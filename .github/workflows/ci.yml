---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' && '["macos-26"]' ||
      '["self-hosted", "macOS", "ARM64", "context-panel"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode
        run: xcodebuild -version

      - name: Run commit gate
        run: scripts/commit-gate.sh

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Validate companion iOS build
        run: scripts/validate-companion-builds.sh ios
