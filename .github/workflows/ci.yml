---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      '["macos-26"]' || '["self-hosted", "macOS", "ARM64", "context-panel"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode
        run: xcodebuild -version

      - name: Run commit gate
        run: scripts/commit-gate.sh

      - name: Validate signed coordinator scripts
        timeout-minutes: 5
        run: >-
          python3 -m unittest
          Tests/ScriptsTests/test_validation_coordinator.py
          Tests/ScriptsTests/test_runtime_receipt_ingestion.py
          Tests/ScriptsTests/test_validation_operator_flow.py
          Tests/ScriptsTests/test_release_workflows.py

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Validate companion iOS build
        run: >-
          scripts/validate-companion-builds.sh
          --configuration Release --archive ios

      - name: Validate companion watchOS build
        run: >-
          scripts/validate-companion-builds.sh --configuration Release watchos

      - name: Validate companion tvOS archive
        run: >-
          scripts/validate-companion-builds.sh --configuration Release --archive tvos
