---
name: TestFlight

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version.
        required: true
        default: "1.0"
        type: string
      build_number:
        description: Build number. Defaults to UTC timestamp.
        required: false
        type: string
      upload:
        description: Upload to App Store Connect. Disable to only export a pkg.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload Mac App
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_APP_STORE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.MACOS_APP_STORE_DISTRIBUTION_CERTIFICATE_P12 }}
      MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64 }}
      MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
      MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64 }}
      CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID: >-
        ${{ secrets.CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_ID }}
      CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET: >-
        ${{ secrets.CONTEXT_PANEL_GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve Build Number
        id: build
        shell: bash
        run: |
          set -euo pipefail
          build_number="${{ inputs.build_number }}"
          if [[ -z "${build_number}" ]]; then
            build_number="$(date -u +%Y%m%d%H%M)"
          fi
          echo "build_number=${build_number}" >>"${GITHUB_OUTPUT}"

      - name: Import Signing Assets
        shell: bash
        run: |
          set -euo pipefail
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          keychain_path="${RUNNER_TEMP}/context-panel-app-store.keychain-db"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          import_p12() {
            local secret_value="$1"
            local file_name="$2"
            local password="${3:-}"
            if [[ -z "${secret_value}" ]]; then
              return
            fi
            local p12_path="${RUNNER_TEMP}/${file_name}"
            printf '%s' "${secret_value}" | base64 -D >"${p12_path}"
            security import "${p12_path}" \
              -P "${password}" \
              -A \
              -k "${keychain_path}"
          }

          import_p12 "${MACOS_CERTIFICATE_P12:-}" "macos-certificate.p12" "${MACOS_CERTIFICATE_PASSWORD:-}"
          import_p12 "${MACOS_APP_STORE_DISTRIBUTION_CERTIFICATE_P12:-}" "app-store-distribution.p12" "${MACOS_APP_STORE_CERTIFICATE_PASSWORD:-${MACOS_CERTIFICATE_PASSWORD:-}}"
          import_p12 "${MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12:-}" "app-store-installer.p12" "${MACOS_APP_STORE_CERTIFICATE_PASSWORD:-${MACOS_CERTIFICATE_PASSWORD:-}}"

          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v "${keychain_path}"

      - name: Write Provisioning Profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/provisioning-appstore
          if [[ -z "${MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64:-}" || -z "${MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64:-}" || -z "${MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            echo "Mac App Store app, widget, and refresh agent provisioning profile secrets are required." >&2
            exit 1
          fi
          printf '%s' "${MACOS_APP_STORE_APP_PROVISIONING_PROFILE_BASE64}" | base64 -D > .build/provisioning-appstore/ContextPanel.provisionprofile
          printf '%s' "${MACOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64}" | base64 -D > .build/provisioning-appstore/ContextPanelWidgetExtension.provisionprofile
          printf '%s' "${MACOS_APP_STORE_REFRESH_AGENT_PROVISIONING_PROFILE_BASE64}" | base64 -D > .build/provisioning-appstore/ContextPanelRefreshAgent.provisionprofile

      - name: Archive and Upload
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --version "${{ inputs.version }}"
            --build-number "${{ steps.build.outputs.build_number }}"
          )
          if [[ "${{ inputs.upload }}" != "true" ]]; then
            args+=(--export-only)
          fi
          scripts/upload-testflight-macos-app.sh "${args[@]}"

      - name: Upload Export Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-export-${{ steps.build.outputs.build_number }}
          path: |
            .build/testflight/UploadOptions.plist
            .build/testflight/upload
          if-no-files-found: ignore
