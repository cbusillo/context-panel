---
name: CodeQL

"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      '["macos-26"]' || '["self-hosted", "macOS", "ARM64", "context-panel"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode
        run: xcodebuild -version

      - name: Prepare trusted CodeQL database path
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          trusted_codeql_root="/tmp/context-panel-codeql/$GITHUB_RUN_ID"
          rm -rf "$trusted_codeql_root"
          mkdir -p "$trusted_codeql_root/db"
          printf 'CONTEXT_PANEL_CODEQL_DB_LOCATION=%s\n' \
            "$trusted_codeql_root/db" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: swift
          db-location: ${{ env.CONTEXT_PANEL_CODEQL_DB_LOCATION }}

      - name: Build
        env:
          TRUSTED_RUN: >-
            ${{
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          checkout_root="$(/bin/pwd -P)"
          swift_args=()

          checkout_cache_key() {
            local digest
            command -v shasum >/dev/null 2>&1 || return 1
            digest="$(
              printf '%s\0' "$checkout_root" |
                shasum -a 256 |
                awk '{ print substr($1, 1, 16) }'
            )" || return 1
            [[ "$digest" =~ ^[0-9a-f]{16}$ ]] || return 1
            printf '%s' "$digest"
          }

          if [[ "$TRUSTED_RUN" == "true" && \
            -n "${CONTEXT_PANEL_ARTIFACT_CACHE_ROOT:-}" ]]; then
            cache_parent="$(dirname "$CONTEXT_PANEL_ARTIFACT_CACHE_ROOT")"
            cache_namespace="$(dirname "$cache_parent")"
          else
            cache_namespace=""
          fi

          if [[ "$TRUSTED_RUN" == "true" && \
            -n "${CONTEXT_PANEL_ARTIFACT_CACHE_ROOT:-}" && \
            ( -d "$CONTEXT_PANEL_ARTIFACT_CACHE_ROOT" || \
              -d "$cache_namespace" ) ]]; then
            if cache_key="$(checkout_cache_key)"; then
              swiftpm_scratch_path="$CONTEXT_PANEL_ARTIFACT_CACHE_ROOT/checkouts/$cache_key/codeql-swiftpm"
            else
              swiftpm_scratch_path="$checkout_root/.build"
            fi
          else
            swiftpm_scratch_path="$checkout_root/.build"
          fi

          mkdir -p "$swiftpm_scratch_path"
          swift_args+=(--scratch-path "$swiftpm_scratch_path")
          echo "CodeQL SwiftPM scratch path: $swiftpm_scratch_path"

          swift build --target ContextPanelCore "${swift_args[@]}"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4

  cleanup-trusted-codeql:
    name: Clean Trusted CodeQL Temp
    needs: analyze
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, context-panel]
    steps:
      - name: Clean trusted CodeQL database path
        run: rm -rf "/tmp/context-panel-codeql/$GITHUB_RUN_ID"
