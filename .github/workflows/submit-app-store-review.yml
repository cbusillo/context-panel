---
name: Submit App Store Review

"on":
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      platform:
        description: App Store platform.
        required: true
        default: MAC_OS
        type: choice
        options:
          - MAC_OS
          - IOS
          - TV_OS
          - VISION_OS
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: false
        type: string
      whats_new:
        description: Release notes for the App Store version.
        required: false
        type: string
      review_notes:
        description: >-
          Optional App Review explanation. TV_OS clears copied prior-version
          notes when omitted and prepends physical-device evidence when a demo
          URL is supplied.
        required: false
        type: string
      tvos_demo_video_url:
        description: >-
          Optional reviewer-accessible HTTPS physical Apple TV demo URL for
          submissions that need current hardware evidence. When supplied, its
          standardized evidence block replaces copied prior-version notes.
        required: false
        type: string
      copy_from_version:
        description: Existing App Store version to copy metadata from.
        required: false
        type: string
      copy_from_platform:
        description: >-
          Platform containing the metadata source. Defaults to the target
          platform.
        required: false
        type: string
      remove_active_review_version:
        description: >-
          Existing App Store version to remove/reuse first when App Store
          Connect blocks creating the target version.
        required: false
        type: string
      dry_run:
        description: >-
          Validate metadata, build, and review path without submitting. With
          remove_active_review_version, only validates metadata/build and the
          removal target because the active review is not removed.
        required: true
        default: false
        type: boolean
      cancel_review_only:
        description: >-
          Cancel/remove the active review for remove_active_review_version and
          exit without creating or submitting a replacement version.
        required: true
        default: false
        type: boolean
      prepare_only:
        description: >-
          Create/update the App Store version, build attachment, and metadata,
          then exit before review submission. Useful for screenshot uploads.
        required: true
        default: false
        type: boolean
      evidence_bundle_sha256:
        description: >-
          SHA-256 of submission-evidence.json on branch
          release-evidence/<version>-<build_number>, made by
          scripts/submission-evidence-bundle.py create. Required for live
          build attachment or submission.
        required: false
        type: string
      validation_train:
        description: Evidence policy tier for live App Store submission.
        required: true
        default: release
        type: choice
        options:
          - release
      release_evidence_mode:
        description: Enforce release evidence by default; shadow remains available for diagnostics.
        required: true
        default: enforce
        type: choice
        options:
          - shadow
          - enforce

permissions:
  contents: read

concurrency:
  group: submit-app-store-review-${{ inputs.platform }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Trusted Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Source and Inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          scripts/release-workflow-guard.sh \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}"

      - name: Require Completed Release Setup
        env:
          RELEASE_APPROVALS_CONFIGURED: ${{ vars.RELEASE_APPROVALS_CONFIGURED }}
        run: scripts/release-approval-config.sh

      - name: Verify No-Click Release Environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-approval-environment.py

  intent:
    name: Record Release Intent
    needs: guard
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: read
    steps:
      - name: Record Standing Acceptance
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          printf 'Release intent under standing acceptance for version %s at %s\n' "$INPUT_VERSION" "$GITHUB_SHA"

  submit:
    name: Submit App Store Review
    needs: [guard, intent]
    runs-on: macos-26
    environment: release

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python Dependencies
        run: |
          python3 -m venv .build/submit-review-venv
          .build/submit-review-venv/bin/python -m pip install --upgrade pip
          .build/submit-review-venv/bin/python -m pip install cryptography

      - name: Fetch Release Evidence Bundle
        if: ${{ inputs.evidence_bundle_sha256 != '' }}
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_BUILD_NUMBER}" ]]; then
            echo "evidence_bundle_sha256 requires build_number" >&2
            exit 1
          fi
          branch="release-evidence/${INPUT_VERSION}-${INPUT_BUILD_NUMBER}"
          mkdir -p .build
          git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          git cat-file blob "refs/remotes/origin/${branch}:submission-evidence.json" \
            > .build/submission-evidence.json
          python3 scripts/submission-evidence-bundle.py extract \
            --bundle .build/submission-evidence.json \
            --sha256 "${INPUT_EVIDENCE_BUNDLE_SHA256}" \
            --version "${INPUT_VERSION}" \
            --build-number "${INPUT_BUILD_NUMBER}" \
            --output-dir .build/submission-evidence \
            > .build/submission-evidence-args.txt

      - name: Check Production CloudKit Schema
        if: ${{ !inputs.dry_run && !inputs.cancel_review_only }}
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloudkit-schema-gate.py check

      - name: Submit Review
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
            ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new }}
          INPUT_REVIEW_NOTES: ${{ inputs.review_notes }}
          INPUT_TVOS_DEMO_VIDEO_URL: ${{ inputs.tvos_demo_video_url }}
          INPUT_COPY_FROM_VERSION: ${{ inputs.copy_from_version }}
          INPUT_COPY_FROM_PLATFORM: ${{ inputs.copy_from_platform }}
          INPUT_REMOVE_ACTIVE_REVIEW_VERSION: >-
            ${{ inputs.remove_active_review_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CANCEL_REVIEW_ONLY: ${{ inputs.cancel_review_only }}
          INPUT_PREPARE_ONLY: ${{ inputs.prepare_only }}
          INPUT_VALIDATION_TRAIN: ${{ inputs.validation_train }}
          INPUT_RELEASE_EVIDENCE_MODE: ${{ inputs.release_evidence_mode }}
          INPUT_EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
        run: |
          set -euo pipefail
          args=(
            --platform "${INPUT_PLATFORM}"
            --version "${INPUT_VERSION}"
          )
          case "${INPUT_RELEASE_EVIDENCE_MODE}" in
            shadow|enforce) ;;
            *)
              echo "release_evidence_mode must be shadow or enforce" >&2
              exit 1
              ;;
          esac
          case "${INPUT_VALIDATION_TRAIN}" in
            beta|rc|release) ;;
            *)
              echo "validation_train must be beta, rc, or release" >&2
              exit 1
              ;;
          esac
          release_evidence_required=false
          if [[ "${INPUT_DRY_RUN}" != "true" && \
            "${INPUT_CANCEL_REVIEW_ONLY}" != "true" && \
            -n "${INPUT_BUILD_NUMBER}" ]]; then
            release_evidence_required=true
          fi
          if [[ "${release_evidence_required}" == "true" && \
            "${INPUT_VALIDATION_TRAIN}" != "release" ]]; then
            echo "live build attachment or submission requires validation_train release" >&2
            exit 1
          fi
          if [[ "${INPUT_CANCEL_REVIEW_ONLY}" != "true" ]]; then
            if [[ -z "${INPUT_BUILD_NUMBER}" && \
              "${INPUT_PREPARE_ONLY}" != "true" ]]; then
              echo "build_number is required unless cancel_review_only" \
                "or prepare_only is true" >&2
              exit 1
            fi
            if [[ -z "${INPUT_WHATS_NEW}" ]]; then
              echo "whats_new is required unless cancel_review_only is true" >&2
              exit 1
            fi
            args+=(
              --whats-new "${INPUT_WHATS_NEW}"
            )
            if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
              args+=(--build-number "${INPUT_BUILD_NUMBER}")
            fi
          fi
          if [[ -n "${INPUT_REVIEW_NOTES}" ]]; then
            args+=(--review-notes "${INPUT_REVIEW_NOTES}")
          fi
          if [[ -n "${INPUT_TVOS_DEMO_VIDEO_URL}" ]]; then
            args+=(--tvos-demo-video-url "${INPUT_TVOS_DEMO_VIDEO_URL}")
          fi
          if [[ -n "${INPUT_COPY_FROM_VERSION}" ]]; then
            args+=(--copy-from-version "${INPUT_COPY_FROM_VERSION}")
          fi
          if [[ -n "${INPUT_COPY_FROM_PLATFORM}" ]]; then
            args+=(--copy-from-platform "${INPUT_COPY_FROM_PLATFORM}")
          fi
          if [[ -n "${INPUT_REMOVE_ACTIVE_REVIEW_VERSION}" ]]; then
            args+=(
              --remove-active-review-version
              "${INPUT_REMOVE_ACTIVE_REVIEW_VERSION}"
            )
          fi
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${INPUT_CANCEL_REVIEW_ONLY}" == "true" ]]; then
            args+=(--cancel-review-only)
          fi
          if [[ "${INPUT_PREPARE_ONLY}" == "true" ]]; then
            args+=(--prepare-only)
          fi
          report_required="false"
          if [[ "${INPUT_DRY_RUN}" != "true" && \
            "${INPUT_CANCEL_REVIEW_ONLY}" != "true" ]]; then
            if [[ "${INPUT_PREPARE_ONLY}" != "true" || \
              -n "${INPUT_BUILD_NUMBER}" ]]; then
              report_required="true"
            fi
          fi
          if [[ -n "${INPUT_EVIDENCE_BUNDLE_SHA256}" ]]; then
            args+=(
              --validation-train "${INPUT_VALIDATION_TRAIN}"
              --release-evidence-mode "${INPUT_RELEASE_EVIDENCE_MODE}"
              --release-evidence-policy Config/ContextPanelReleaseEvidencePolicy.json
              --release-evidence-surface-policy Config/ContextPanelSurfacePolicy.json
            )
            while IFS= read -r argument; do
              args+=("${argument}")
            done < .build/submission-evidence-args.txt
          elif [[ "${report_required}" == "true" ]]; then
            echo "evidence_bundle_sha256 is required for live build attachment or submission" >&2
            exit 1
          fi
          submit=(
            .build/submit-review-venv/bin/python
            scripts/submit-app-store-review.py
          )
          "${submit[@]}" "${args[@]}"
          {
            echo "### App Store Review Submission"
            echo
            echo "- Platform: ${INPUT_PLATFORM}"
            echo "- Version: ${INPUT_VERSION}"
            if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
              echo "- Build number: ${INPUT_BUILD_NUMBER}"
            fi
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Dry run: ${INPUT_DRY_RUN}"
            echo "- Cancel review only: ${INPUT_CANCEL_REVIEW_ONLY}"
            echo "- Prepare only: ${INPUT_PREPARE_ONLY}"
            if [[ -n "${INPUT_EVIDENCE_BUNDLE_SHA256}" ]]; then
              echo "- Evidence bundle: release-evidence/${INPUT_VERSION}-${INPUT_BUILD_NUMBER}"
              echo "- Evidence bundle SHA-256: ${INPUT_EVIDENCE_BUNDLE_SHA256}"
              echo "- Validation report SHA-256: $(shasum -a 256 .build/submission-evidence/validationReport.json | awk '{print $1}')"
              echo "- Release evidence report SHA-256: $(shasum -a 256 .build/submission-evidence/releaseEvidenceReport.json | awk '{print $1}')"
              echo "- Release evidence mode: ${INPUT_RELEASE_EVIDENCE_MODE}"
            fi
            echo "- Result: succeeded"
          } >>"${GITHUB_STEP_SUMMARY}"

  record-submission:
    name: Record Submitted Build
    needs: submit
    if: >-
      ${{ !inputs.dry_run && !inputs.cancel_review_only && !inputs.prepare_only
      && inputs.build_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: app-store-release-status
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark the Ship record as submitted
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 scripts/app-store-release-status.py record-submission
