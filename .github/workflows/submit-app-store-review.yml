---
name: Submit App Store Review

"on":
  workflow_call:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      platform:
        description: App Store platform.
        required: false
        default: MAC_OS
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: false
        type: string
      whats_new:
        description: Release notes for the App Store version.
        required: false
        type: string
      review_notes:
        description: >-
          Optional App Review explanation. TV_OS clears copied prior-version
          notes when omitted and prepends physical-device evidence when a demo
          URL is supplied.
        required: false
        type: string
      tvos_demo_video_url:
        description: >-
          Optional reviewer-accessible HTTPS physical Apple TV demo URL for
          submissions that need current hardware evidence. When supplied, its
          standardized evidence block replaces copied prior-version notes.
        required: false
        type: string
      copy_from_version:
        description: Existing App Store version to copy metadata from.
        required: false
        type: string
      copy_from_platform:
        description: >-
          Platform containing the metadata source. Defaults to the target
          platform.
        required: false
        type: string
      remove_active_review_version:
        description: >-
          Existing App Store version to remove/reuse first when App Store
          Connect blocks creating the target version.
        required: false
        type: string
      dry_run:
        description: >-
          Validate metadata, build, and review path without submitting.
        required: false
        default: false
        type: boolean
      cancel_review_only:
        description: Cancel review without creating or submitting a replacement.
        required: false
        default: false
        type: boolean
      prepare_only:
        description: >-
          Create/update the App Store version without submitting review.
        required: false
        default: false
        type: boolean
      validation_report_base64:
        description: >-
          Base64 JSON from context-panel-validation.py final-report --json.
          Required for live build attachment or submission.
        required: false
        type: string
      validation_train:
        description: >-
          Evidence policy tier. Live build attachment or submission requires
          release; lower tiers are only valid for non-live validation.
        required: false
        default: release
        type: string
      release_evidence_mode:
        description: Run release evidence in shadow or enforce mode.
        required: false
        default: shadow
        type: string
      release_evidence_report_base64:
        description: Base64 JSON from context-panel-release-gate.py.
        required: false
        type: string
      release_evidence_comparison_base64:
        description: Base64 full source-manifest comparison used by the release gate.
        required: false
        type: string
      release_evidence_expected_build_manifests_base64:
        description: Base64 JSON array of sealed ExpectedBuildManifest objects.
        required: false
        type: string
      release_evidence_previous_ledger_base64:
        description: Base64 replayable lineage bundle for prior approved evidence.
        required: false
        type: string
      release_evidence_selected_rc_ledger_base64:
        description: Base64 replayable lineage bundle for the exact approved RC.
        required: false
        type: string
      release_evidence_host_os_evidence_base64:
        description: Base64 bounded host-OS evidence used by placement carry-forward.
        required: false
        type: string
      release_evidence_shadow_evidence_base64:
        description: Base64 signed shadow-train comparison evidence.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      platform:
        description: App Store platform.
        required: true
        default: MAC_OS
        type: choice
        options:
          - MAC_OS
          - IOS
          - TV_OS
          - VISION_OS
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: false
        type: string
      whats_new:
        description: Release notes for the App Store version.
        required: false
        type: string
      review_notes:
        description: >-
          Optional App Review explanation. TV_OS clears copied prior-version
          notes when omitted and prepends physical-device evidence when a demo
          URL is supplied.
        required: false
        type: string
      tvos_demo_video_url:
        description: >-
          Optional reviewer-accessible HTTPS physical Apple TV demo URL for
          submissions that need current hardware evidence. When supplied, its
          standardized evidence block replaces copied prior-version notes.
        required: false
        type: string
      copy_from_version:
        description: Existing App Store version to copy metadata from.
        required: false
        type: string
      copy_from_platform:
        description: >-
          Platform containing the metadata source. Defaults to the target
          platform.
        required: false
        type: string
      remove_active_review_version:
        description: >-
          Existing App Store version to remove/reuse first when App Store
          Connect blocks creating the target version.
        required: false
        type: string
      dry_run:
        description: >-
          Validate metadata, build, and review path without submitting. With
          remove_active_review_version, only validates metadata/build and the
          removal target because the active review is not removed.
        required: true
        default: false
        type: boolean
      cancel_review_only:
        description: >-
          Cancel/remove the active review for remove_active_review_version and
          exit without creating or submitting a replacement version.
        required: true
        default: false
        type: boolean
      prepare_only:
        description: >-
          Create/update the App Store version, build attachment, and metadata,
          then exit before review submission. Useful for screenshot uploads.
        required: true
        default: false
        type: boolean
      validation_report_base64:
        description: >-
          Base64 JSON from context-panel-validation.py final-report --json.
          Required for live build attachment or submission.
        required: false
        type: string
      validation_train:
        description: Evidence policy tier for live App Store submission.
        required: true
        default: release
        type: choice
        options:
          - release
      release_evidence_mode:
        description: Run release evidence in shadow or enforce mode.
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - enforce
      release_evidence_report_base64:
        description: Base64 JSON from context-panel-release-gate.py.
        required: false
        type: string
      release_evidence_comparison_base64:
        description: Base64 full source-manifest comparison used by the release gate.
        required: false
        type: string
      release_evidence_expected_build_manifests_base64:
        description: Base64 JSON array of sealed ExpectedBuildManifest objects.
        required: false
        type: string
      release_evidence_previous_ledger_base64:
        description: Base64 replayable lineage bundle for prior approved evidence.
        required: false
        type: string
      release_evidence_selected_rc_ledger_base64:
        description: Base64 replayable lineage bundle for the exact approved RC.
        required: false
        type: string
      release_evidence_host_os_evidence_base64:
        description: Base64 bounded host-OS evidence used by placement carry-forward.
        required: false
        type: string
      release_evidence_shadow_evidence_base64:
        description: Base64 signed shadow-train comparison evidence.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: submit-app-store-review-${{ inputs.platform }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit App Store Review
    runs-on: macos-26

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python Dependencies
        run: |
          python3 -m venv .build/submit-review-venv
          .build/submit-review-venv/bin/python -m pip install --upgrade pip
          .build/submit-review-venv/bin/python -m pip install cryptography

      - name: Prepare Validation Report
        if: ${{ inputs.validation_report_base64 != '' }}
        shell: bash
        env:
          INPUT_VALIDATION_REPORT_BASE64: ${{ inputs.validation_report_base64 }}
        run: |
          set -euo pipefail
          mkdir -p .build
          printf '%s' "${INPUT_VALIDATION_REPORT_BASE64}" \
            | base64 -D > .build/validation-report.json
          python3 -m json.tool .build/validation-report.json >/dev/null

      - name: Prepare Release Evidence Report
        if: ${{ inputs.release_evidence_report_base64 != '' }}
        shell: bash
        env:
          INPUT_RELEASE_EVIDENCE_REPORT_BASE64: >-
            ${{ inputs.release_evidence_report_base64 }}
          INPUT_RELEASE_EVIDENCE_COMPARISON_BASE64: >-
            ${{ inputs.release_evidence_comparison_base64 }}
          INPUT_RELEASE_EVIDENCE_EXPECTED_BUILD_MANIFESTS_BASE64: >-
            ${{ inputs.release_evidence_expected_build_manifests_base64 }}
          INPUT_RELEASE_EVIDENCE_PREVIOUS_LEDGER_BASE64: >-
            ${{ inputs.release_evidence_previous_ledger_base64 }}
          INPUT_RELEASE_EVIDENCE_SELECTED_RC_LEDGER_BASE64: >-
            ${{ inputs.release_evidence_selected_rc_ledger_base64 }}
          INPUT_RELEASE_EVIDENCE_HOST_OS_EVIDENCE_BASE64: >-
            ${{ inputs.release_evidence_host_os_evidence_base64 }}
          INPUT_RELEASE_EVIDENCE_SHADOW_EVIDENCE_BASE64: >-
            ${{ inputs.release_evidence_shadow_evidence_base64 }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_RELEASE_EVIDENCE_COMPARISON_BASE64}" || \
            -z "${INPUT_RELEASE_EVIDENCE_EXPECTED_BUILD_MANIFESTS_BASE64}" ]]; then
            echo "release evidence requires comparison and expected-build manifest inputs" >&2
            exit 1
          fi
          mkdir -p .build
          printf '%s' "${INPUT_RELEASE_EVIDENCE_REPORT_BASE64}" \
            | base64 -D > .build/release-evidence-report.json
          python3 -m json.tool .build/release-evidence-report.json >/dev/null
          printf '%s' "${INPUT_RELEASE_EVIDENCE_COMPARISON_BASE64}" \
            | base64 -D > .build/release-evidence-comparison.json
          python3 -m json.tool .build/release-evidence-comparison.json >/dev/null
          printf '%s' "${INPUT_RELEASE_EVIDENCE_EXPECTED_BUILD_MANIFESTS_BASE64}" \
            | base64 -D > .build/release-evidence-expected-build-manifests.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(
              Path(".build/release-evidence-expected-build-manifests.json").read_text()
          )
          if not isinstance(bundle, list) or not bundle:
              raise SystemExit("expected-build manifest bundle must be a non-empty JSON array")
          destination = Path(".build/release-evidence-expected-build-manifests")
          destination.mkdir(parents=True, exist_ok=True)
          for index, manifest in enumerate(bundle):
              if not isinstance(manifest, dict):
                  raise SystemExit("expected-build manifest bundle contains a non-object")
              (destination / f"{index:03d}.json").write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n"
              )
          PY
          decode_optional_json() {
            local value="$1"
            local destination="$2"
            if [[ -n "${value}" ]]; then
              printf '%s' "${value}" | base64 -D > "${destination}"
              python3 -m json.tool "${destination}" >/dev/null
            fi
          }
          decode_optional_json "${INPUT_RELEASE_EVIDENCE_PREVIOUS_LEDGER_BASE64}" \
            .build/release-evidence-previous-ledger.json
          decode_optional_json "${INPUT_RELEASE_EVIDENCE_SELECTED_RC_LEDGER_BASE64}" \
            .build/release-evidence-selected-rc-ledger.json
          decode_optional_json "${INPUT_RELEASE_EVIDENCE_HOST_OS_EVIDENCE_BASE64}" \
            .build/release-evidence-host-os.json
          decode_optional_json "${INPUT_RELEASE_EVIDENCE_SHADOW_EVIDENCE_BASE64}" \
            .build/release-evidence-shadow.json

      - name: Submit Review
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new }}
          INPUT_REVIEW_NOTES: ${{ inputs.review_notes }}
          INPUT_TVOS_DEMO_VIDEO_URL: ${{ inputs.tvos_demo_video_url }}
          INPUT_COPY_FROM_VERSION: ${{ inputs.copy_from_version }}
          INPUT_COPY_FROM_PLATFORM: ${{ inputs.copy_from_platform }}
          INPUT_REMOVE_ACTIVE_REVIEW_VERSION: >-
            ${{ inputs.remove_active_review_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CANCEL_REVIEW_ONLY: ${{ inputs.cancel_review_only }}
          INPUT_PREPARE_ONLY: ${{ inputs.prepare_only }}
          INPUT_VALIDATION_REPORT_BASE64: ${{ inputs.validation_report_base64 }}
          INPUT_VALIDATION_TRAIN: ${{ inputs.validation_train }}
          INPUT_RELEASE_EVIDENCE_MODE: ${{ inputs.release_evidence_mode }}
          INPUT_RELEASE_EVIDENCE_REPORT_BASE64: >-
            ${{ inputs.release_evidence_report_base64 }}
          INPUT_RELEASE_EVIDENCE_COMPARISON_BASE64: >-
            ${{ inputs.release_evidence_comparison_base64 }}
          INPUT_RELEASE_EVIDENCE_EXPECTED_BUILD_MANIFESTS_BASE64: >-
            ${{ inputs.release_evidence_expected_build_manifests_base64 }}
          INPUT_RELEASE_EVIDENCE_PREVIOUS_LEDGER_BASE64: >-
            ${{ inputs.release_evidence_previous_ledger_base64 }}
          INPUT_RELEASE_EVIDENCE_SELECTED_RC_LEDGER_BASE64: >-
            ${{ inputs.release_evidence_selected_rc_ledger_base64 }}
          INPUT_RELEASE_EVIDENCE_HOST_OS_EVIDENCE_BASE64: >-
            ${{ inputs.release_evidence_host_os_evidence_base64 }}
          INPUT_RELEASE_EVIDENCE_SHADOW_EVIDENCE_BASE64: >-
            ${{ inputs.release_evidence_shadow_evidence_base64 }}
        run: |
          set -euo pipefail
          args=(
            --platform "${INPUT_PLATFORM}"
            --version "${INPUT_VERSION}"
          )
          case "${INPUT_RELEASE_EVIDENCE_MODE}" in
            shadow|enforce) ;;
            *)
              echo "release_evidence_mode must be shadow or enforce" >&2
              exit 1
              ;;
          esac
          case "${INPUT_VALIDATION_TRAIN}" in
            beta|rc|release) ;;
            *)
              echo "validation_train must be beta, rc, or release" >&2
              exit 1
              ;;
          esac
          release_evidence_required=false
          if [[ "${INPUT_DRY_RUN}" != "true" && \
            "${INPUT_CANCEL_REVIEW_ONLY}" != "true" && \
            -n "${INPUT_BUILD_NUMBER}" ]]; then
            release_evidence_required=true
          fi
          if [[ "${release_evidence_required}" == "true" && \
            "${INPUT_VALIDATION_TRAIN}" != "release" ]]; then
            echo "live build attachment or submission requires validation_train release" >&2
            exit 1
          fi
          if [[ "${INPUT_CANCEL_REVIEW_ONLY}" != "true" ]]; then
            if [[ -z "${INPUT_BUILD_NUMBER}" && \
              "${INPUT_PREPARE_ONLY}" != "true" ]]; then
              echo "build_number is required unless cancel_review_only" \
                "or prepare_only is true" >&2
              exit 1
            fi
            if [[ -z "${INPUT_WHATS_NEW}" ]]; then
              echo "whats_new is required unless cancel_review_only is true" >&2
              exit 1
            fi
            args+=(
              --whats-new "${INPUT_WHATS_NEW}"
            )
            if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
              args+=(--build-number "${INPUT_BUILD_NUMBER}")
            fi
          fi
          if [[ -n "${INPUT_REVIEW_NOTES}" ]]; then
            args+=(--review-notes "${INPUT_REVIEW_NOTES}")
          fi
          if [[ -n "${INPUT_TVOS_DEMO_VIDEO_URL}" ]]; then
            args+=(--tvos-demo-video-url "${INPUT_TVOS_DEMO_VIDEO_URL}")
          fi
          if [[ -n "${INPUT_COPY_FROM_VERSION}" ]]; then
            args+=(--copy-from-version "${INPUT_COPY_FROM_VERSION}")
          fi
          if [[ -n "${INPUT_COPY_FROM_PLATFORM}" ]]; then
            args+=(--copy-from-platform "${INPUT_COPY_FROM_PLATFORM}")
          fi
          if [[ -n "${INPUT_REMOVE_ACTIVE_REVIEW_VERSION}" ]]; then
            args+=(
              --remove-active-review-version
              "${INPUT_REMOVE_ACTIVE_REVIEW_VERSION}"
            )
          fi
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${INPUT_CANCEL_REVIEW_ONLY}" == "true" ]]; then
            args+=(--cancel-review-only)
          fi
          if [[ "${INPUT_PREPARE_ONLY}" == "true" ]]; then
            args+=(--prepare-only)
          fi
          report_required="false"
          if [[ "${INPUT_DRY_RUN}" != "true" && \
            "${INPUT_CANCEL_REVIEW_ONLY}" != "true" ]]; then
            if [[ "${INPUT_PREPARE_ONLY}" != "true" || \
              -n "${INPUT_BUILD_NUMBER}" ]]; then
              report_required="true"
            fi
          fi
          if [[ "${report_required}" == "true" ]]; then
            if [[ -z "${INPUT_VALIDATION_REPORT_BASE64}" ]]; then
              echo "validation_report_base64 is required before attaching or submitting a build" >&2
              exit 1
            fi
            args+=(--validation-report .build/validation-report.json)
          fi
          if [[ -n "${INPUT_RELEASE_EVIDENCE_REPORT_BASE64}" ]]; then
            args+=(
              --validation-train "${INPUT_VALIDATION_TRAIN}"
              --release-evidence-mode "${INPUT_RELEASE_EVIDENCE_MODE}"
              --release-evidence-report .build/release-evidence-report.json
              --release-evidence-comparison .build/release-evidence-comparison.json
              --release-evidence-policy Config/ContextPanelReleaseEvidencePolicy.json
              --release-evidence-surface-policy Config/ContextPanelSurfacePolicy.json
            )
            while IFS= read -r manifest; do
              args+=(--release-evidence-expected-build-manifest "${manifest}")
            done < <(find .build/release-evidence-expected-build-manifests \
              -type f -name '*.json' -print | sort)
            if [[ -f .build/release-evidence-previous-ledger.json ]]; then
              args+=(--release-evidence-previous-ledger \
                .build/release-evidence-previous-ledger.json)
            fi
            if [[ -f .build/release-evidence-selected-rc-ledger.json ]]; then
              args+=(--release-evidence-selected-rc-ledger \
                .build/release-evidence-selected-rc-ledger.json)
            fi
            if [[ -f .build/release-evidence-host-os.json ]]; then
              args+=(--release-evidence-host-os-evidence \
                .build/release-evidence-host-os.json)
            fi
            if [[ -f .build/release-evidence-shadow.json ]]; then
              args+=(--release-evidence-shadow-evidence \
                .build/release-evidence-shadow.json)
            fi
          elif [[ "${report_required}" == "true" ]]; then
            echo "release_evidence_report_base64 is required for live shadow or enforce validation" >&2
            exit 1
          fi
          submit=(
            .build/submit-review-venv/bin/python
            scripts/submit-app-store-review.py
          )
          "${submit[@]}" "${args[@]}"
          {
            echo "### App Store Review Submission"
            echo
            echo "- Platform: ${INPUT_PLATFORM}"
            echo "- Version: ${INPUT_VERSION}"
            if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
              echo "- Build number: ${INPUT_BUILD_NUMBER}"
            fi
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Dry run: ${INPUT_DRY_RUN}"
            echo "- Cancel review only: ${INPUT_CANCEL_REVIEW_ONLY}"
            echo "- Prepare only: ${INPUT_PREPARE_ONLY}"
            if [[ "${report_required}" == "true" ]]; then
              echo "- Validation report SHA-256: $(shasum -a 256 .build/validation-report.json | awk '{print $1}')"
              echo "- Release evidence mode: ${INPUT_RELEASE_EVIDENCE_MODE}"
              if [[ -n "${INPUT_RELEASE_EVIDENCE_REPORT_BASE64}" ]]; then
                echo "- Release evidence report SHA-256: $(shasum -a 256 .build/release-evidence-report.json | awk '{print $1}')"
              else
                echo "- Release evidence report: not required for this non-live operation"
              fi
            fi
            echo "- Result: succeeded"
          } >>"${GITHUB_STEP_SUMMARY}"
