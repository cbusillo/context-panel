---
name: Submit App Store Review

"on":
  workflow_call:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: false
        type: string
      whats_new:
        description: Release notes for the App Store version.
        required: false
        type: string
      copy_from_version:
        description: Existing App Store version to copy metadata from.
        required: false
        type: string
      remove_active_review_version:
        description: >-
          Existing App Store version to remove/reuse first when App Store
          Connect blocks creating the target version.
        required: false
        type: string
      dry_run:
        description: Validate metadata, build, and review path without submitting.
        required: false
        default: false
        type: boolean
      cancel_review_only:
        description: Cancel review without creating or submitting a replacement.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version.
        required: true
        type: string
      build_number:
        description: Uploaded CFBundleVersion/build number.
        required: false
        type: string
      whats_new:
        description: Release notes for the App Store version.
        required: false
        type: string
      copy_from_version:
        description: Existing App Store version to copy metadata from.
        required: false
        type: string
      remove_active_review_version:
        description: >-
          Existing App Store version to remove/reuse first when App Store
          Connect blocks creating the target version.
        required: false
        type: string
      dry_run:
        description: >-
          Validate metadata, build, and review path without submitting. With
          remove_active_review_version, only validates metadata/build and the
          removal target because the active review is not removed.
        required: true
        default: false
        type: boolean
      cancel_review_only:
        description: >-
          Cancel/remove the active review for remove_active_review_version and
          exit without creating or submitting a replacement version.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: submit-app-store-review-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit App Store Review
    runs-on: macos-latest

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: >-
        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python Dependencies
        run: |
          python3 -m venv .build/submit-review-venv
          .build/submit-review-venv/bin/python -m pip install --upgrade pip
          .build/submit-review-venv/bin/python -m pip install cryptography

      - name: Submit Review
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new }}
          INPUT_COPY_FROM_VERSION: ${{ inputs.copy_from_version }}
          INPUT_REMOVE_ACTIVE_REVIEW_VERSION: >-
            ${{ inputs.remove_active_review_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CANCEL_REVIEW_ONLY: ${{ inputs.cancel_review_only }}
        run: |
          set -euo pipefail
          args=(
            --version "${INPUT_VERSION}"
          )
          if [[ "${INPUT_CANCEL_REVIEW_ONLY}" != "true" ]]; then
            if [[ -z "${INPUT_BUILD_NUMBER}" ]]; then
              echo "build_number is required unless cancel_review_only" \
                "is true" >&2
              exit 1
            fi
            if [[ -z "${INPUT_WHATS_NEW}" ]]; then
              echo "whats_new is required unless cancel_review_only is true" >&2
              exit 1
            fi
            args+=(
              --build-number "${INPUT_BUILD_NUMBER}"
              --whats-new "${INPUT_WHATS_NEW}"
            )
          fi
          if [[ -n "${INPUT_COPY_FROM_VERSION}" ]]; then
            args+=(--copy-from-version "${INPUT_COPY_FROM_VERSION}")
          fi
          if [[ -n "${INPUT_REMOVE_ACTIVE_REVIEW_VERSION}" ]]; then
            args+=(
              --remove-active-review-version
              "${INPUT_REMOVE_ACTIVE_REVIEW_VERSION}"
            )
          fi
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${INPUT_CANCEL_REVIEW_ONLY}" == "true" ]]; then
            args+=(--cancel-review-only)
          fi
          submit=(
            .build/submit-review-venv/bin/python
            scripts/submit-app-store-review.py
          )
          "${submit[@]}" "${args[@]}"
          {
            echo "### App Store Review Submission"
            echo
            echo "- Version: ${INPUT_VERSION}"
            if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
              echo "- Build number: ${INPUT_BUILD_NUMBER}"
            fi
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Dry run: ${INPUT_DRY_RUN}"
            echo "- Cancel review only: ${INPUT_CANCEL_REVIEW_ONLY}"
            echo "- Result: succeeded"
          } >>"${GITHUB_STEP_SUMMARY}"
