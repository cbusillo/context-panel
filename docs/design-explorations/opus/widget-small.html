<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Panel Small Widget</title>
<!-- Context Panel design exploration "Horizon" (Claude Opus). Static mockup, synthetic accounts only.
     Theme follows the system; add ?theme=light or ?theme=dark to force one. -->
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<style>
:root{
  color-scheme: light;
  --bg:#ECEEF2; --wall1:#C9D6E8; --wall2:#E9DDEB;
  --window:#F6F6F8; --sidebar:#EDEDF0; --surface:#FFFFFF; --raised:#FFFFFF;
  --ink:#1D1D1F; --ink2:#55555C; --ink3:#6C6C74; --hair:rgba(0,0,0,.08); --grid:rgba(0,0,0,.07);
  --track:rgba(0,0,0,.055);
  --openai:#0F7A6B; --claude:#A3631B; --google:#6A4BD6;
  --openai-tint:rgba(15,122,107,.07); --claude-tint:rgba(163,99,27,.075); --google-tint:rgba(106,75,214,.07);
  --red:#CC1F2F; --red-tint:rgba(204,31,47,.07); --banked:#0A6FCC;
  --widget:rgba(255,255,255,.86); --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(30,40,70,.12);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E0F13; --wall1:#1B2337; --wall2:#2A1E33;
  --window:#1E1E21; --sidebar:#252528; --surface:#2A2A2E; --raised:#303035;
  --ink:#F2F2F5; --ink2:#B4B4BC; --ink3:#9A9AA3; --hair:rgba(255,255,255,.09); --grid:rgba(255,255,255,.07);
  --track:rgba(255,255,255,.07);
  --openai:#3CC4AE; --claude:#E3A65C; --google:#A895FF;
  --openai-tint:rgba(60,196,174,.09); --claude-tint:rgba(227,166,92,.09); --google-tint:rgba(168,149,255,.1);
  --red:#FF6B6E; --red-tint:rgba(255,107,110,.09); --banked:#5DB2FF;
  --widget:rgba(30,30,33,.88); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0E0F13; --wall1:#1B2337; --wall2:#2A1E33;
  --window:#1E1E21; --sidebar:#252528; --surface:#2A2A2E; --raised:#303035;
  --ink:#F2F2F5; --ink2:#B4B4BC; --ink3:#9A9AA3; --hair:rgba(255,255,255,.09); --grid:rgba(255,255,255,.07);
  --track:rgba(255,255,255,.07);
  --openai:#3CC4AE; --claude:#E3A65C; --google:#A895FF;
  --openai-tint:rgba(60,196,174,.09); --claude-tint:rgba(227,166,92,.09); --google-tint:rgba(168,149,255,.1);
  --red:#FF6B6E; --red-tint:rgba(255,107,110,.09); --banked:#5DB2FF;
  --widget:rgba(30,30,33,.88); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.openai{--p:var(--openai);--pt:var(--openai-tint)} .claude{--p:var(--claude);--pt:var(--claude-tint)} .google{--p:var(--google);--pt:var(--google-tint)}
.pname{color:var(--p);font-weight:650;letter-spacing:.01em}
.red{color:var(--red)}
.dia{display:inline-block;width:8px;height:8px;background:var(--banked);transform:rotate(45deg);border-radius:1px;margin:0 4px 1px 1px}
.desk{background:radial-gradient(120% 120% at 0% 0%,var(--wall1),transparent 60%),radial-gradient(120% 120% at 100% 100%,var(--wall2),transparent 60%),var(--bg)}

.stage{padding:28px;display:inline-block}
.w{background:var(--widget);border-radius:22px;box-shadow:var(--shadow),0 0 0 .5px var(--hair);padding:13px 14px;overflow:hidden;
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);position:relative}
.wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wt{font-size:12.5px;font-weight:700;letter-spacing:-.005em}
.wr{font-size:11px;color:var(--ink3);font-weight:500}
.small{width:164px;height:164px}
.medium{width:344px;height:164px}
.large{width:344px;height:344px}
.cap{font-size:10.5px;font-weight:650;color:var(--p);letter-spacing:.01em}
.status{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.status .d{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}

.small{padding:12px 13px}.srow{display:block;padding:1px 0 1px 7px;border-left:2.5px solid var(--p);margin-bottom:7px}
.srow .l1{display:flex;justify-content:space-between;align-items:baseline}
.srow .l1 b{font-size:11px;font-weight:650;color:var(--ink)}
.srow .nm{font-size:11.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.small .wh{margin-bottom:9px}.small .status{font-size:10.5px;margin-top:2px}
</style>
</head>
<body>
<div class="stage desk"><div class="w small"><div class="wh"><span class="wt">Context Panel</span><span class="wr">next up</span></div>
<a class="srow openai" href="contextpanel://account/synthetic-1"><div class="l1"><span class="cap">OpenAI</span><b>72%</b></div><div class="nm">work@example.invalid</div></a><a class="srow claude" href="contextpanel://account/synthetic-4"><div class="l1"><span class="cap">Claude</span><b>57%</b></div><div class="nm">Claude backup</div></a><a class="srow google" href="contextpanel://account/synthetic-5"><div class="l1"><span class="cap">Google</span><b>91%</b></div><div class="nm">Antigravity</div></a><div class="status red"><span class="d"></span>2 run out before reset</div></div></div>
</body>
</html>
